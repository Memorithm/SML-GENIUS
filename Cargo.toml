[workspace]
members = [
    "crates/sml-core",
    "crates/sml-native-kernels",
    "crates/sml-cli",
    "crates/sml-store",
    "crates/sml-decision",
    "crates/sml-runtime",
    "crates/sml-rsi",
    "crates/sml-elastic-bench",
    "crates/sml-publication",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Tarek Zekriti"]

[workspace.lints.rust]
unsafe_code = "forbid"
