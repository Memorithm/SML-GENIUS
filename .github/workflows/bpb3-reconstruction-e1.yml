name: BPB-3 E1 official GGML K-encoder reconstruction and E2 controls

on:
  pull_request:
    paths:
      - 'research/boolean-posit/reconstruction_e1.rs'
      - 'research/boolean-posit/RECONSTRUCTION_E1.md'
      - '.github/workflows/bpb3-reconstruction-e1.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/reconstruction_e1.rs'
      - 'research/boolean-posit/RECONSTRUCTION_E1.md'
      - '.github/workflows/bpb3-reconstruction-e1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ggml-original-float-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.89 and verify style
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
          rustfmt --edition 2021 --check research/boolean-posit/reconstruction_e1.rs
      - name: Fetch immutable GGML reference with no machine-state changes
        shell: bash
        env:
          GGML_SHA: f7591a6a01f9273de03331732bdc0b39721168be
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/llama-reference"
          git -C "$RUNNER_TEMP/llama-reference" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama-reference" -c credential.helper= fetch --depth=1 --no-tags origin "$GGML_SHA"
          git -C "$RUNNER_TEMP/llama-reference" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama-reference" rev-parse HEAD)" = "$GGML_SHA"
          printf 'ggml_sha=%s\n' "$GGML_SHA" > "$RUNNER_TEMP/bpb3-e1-provenance.txt"
          sha256sum research/boolean-posit/reconstruction_e1.rs research/boolean-posit/gguf_k.rs \
            >> "$RUNNER_TEMP/bpb3-e1-provenance.txt"
      - name: Build reference CPU ggml-base shared library only
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/llama-reference" -B "$RUNNER_TEMP/ggml-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF \
            -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/ggml-build" --target ggml-base -j 2
          LIB="$(find "$RUNNER_TEMP/ggml-build" -type f -name 'libggml-base.so*' | head -n 1)"
          test -n "$LIB"
          dirname "$LIB" > "$RUNNER_TEMP/ggml-libdir.txt"
          echo "GGML_LIBRARY=$(basename "$LIB")" >> "$RUNNER_TEMP/bpb3-e1-provenance.txt"
      - name: Test and execute real official Q3_K/Q4_K encoder and Rust decoder
        shell: bash
        run: |
          set -euo pipefail
          LIBDIR="$(cat "$RUNNER_TEMP/ggml-libdir.txt")"
          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"
          rustc --edition=2021 --test research/boolean-posit/reconstruction_e1.rs \
            -L "native=$LIBDIR" -o "$RUNNER_TEMP/bpb3-e1-tests"
          "$RUNNER_TEMP/bpb3-e1-tests" | tee "$RUNNER_TEMP/bpb3-e1-tests.txt"
          rustc --edition=2021 -O research/boolean-posit/reconstruction_e1.rs \
            -L "native=$LIBDIR" -o "$RUNNER_TEMP/bpb3-e1-binary"
          "$RUNNER_TEMP/bpb3-e1-binary" | tee "$RUNNER_TEMP/bpb3-e1-synthetic.csv"
          grep -q '^protocol=bpb3-ggml-original-f32-e1-v1,dataset_kind=SYNTHETIC' "$RUNNER_TEMP/bpb3-e1-synthetic.csv"
          test "$(grep -c '^DEV,' "$RUNNER_TEMP/bpb3-e1-synthetic.csv")" -eq 16
          test "$(grep -c '^TEST,' "$RUNNER_TEMP/bpb3-e1-synthetic.csv")" -eq 16
          grep -q ',GGUF_Q3_K,24,3.437500,110,' "$RUNNER_TEMP/bpb3-e1-synthetic.csv"
          grep -q ',GGUF_Q4_K,24,4.500000,144,' "$RUNNER_TEMP/bpb3-e1-synthetic.csv"
          grep -q ',BPB-3+2xFP16_RESIDUAL,24,3.437500,110,' "$RUNNER_TEMP/bpb3-e1-synthetic.csv"
      - name: Retain exact study outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3-e1-original-float-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bpb3-e1-synthetic.csv
            ${{ runner.temp }}/bpb3-e1-tests.txt
            ${{ runner.temp }}/bpb3-e1-provenance.txt
          if-no-files-found: warn
          retention-days: 30
