name: BPB-3 E1 trained real-weight holdout via official GGML K encoders

on:
  pull_request:
    paths:
      - 'research/boolean-posit/reconstruction_e1.rs'
      - 'research/boolean-posit/real_weight_corpus.py'
      - 'research/boolean-posit/RECONSTRUCTION_E1.md'
      - '.github/workflows/bpb3-reconstruction-real-weights.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/reconstruction_e1.rs'
      - 'research/boolean-posit/real_weight_corpus.py'
      - 'research/boolean-posit/RECONSTRUCTION_E1.md'
      - '.github/workflows/bpb3-reconstruction-real-weights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensed-trained-weight-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned NumPy, safetensors and Hub clients
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bpb3-weights-venv"
          "$RUNNER_TEMP/bpb3-weights-venv/bin/pip" install --disable-pip-version-check \
            numpy==2.2.6 safetensors==0.6.2 huggingface_hub==0.35.3 hf_xet==1.1.10
          "$RUNNER_TEMP/bpb3-weights-venv/bin/python" -m py_compile \
            research/boolean-posit/real_weight_corpus.py
      - name: Fetch exact open-license trained model checkpoint
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          export WEIGHTS_DIR="$RUNNER_TEMP/bpb3-pythia"
          mkdir -p "$WEIGHTS_DIR"
          "$RUNNER_TEMP/bpb3-weights-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          local = hf_hub_download(
              repo_id="EleutherAI/pythia-14m",
              filename="model.safetensors",
              revision="94f7c35d5e9f2e9bac8ca839329f505b4d007d5d",
              local_dir=os.environ["WEIGHTS_DIR"],
          )
          print("PYTHIA_DOWNLOAD_COMPLETE", local)
          PY
          echo '116a02532db461f91386a5b20f942ff2c8d4de7341e21b55caafc3d7b25f49a1  '"$WEIGHTS_DIR/model.safetensors" \
            | sha256sum -c -
      - name: Freeze disjoint licensed model tensor strata and provenance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bpb3-weights-venv/bin/python" \
            research/boolean-posit/real_weight_corpus.py \
            "$RUNNER_TEMP/bpb3-pythia/model.safetensors" \
            "$RUNNER_TEMP/bpb3-pythia/selected" \
            | tee "$RUNNER_TEMP/bpb3-real-admission.txt"
          grep -q '^PASS_PYTHIA_REAL_WEIGHTS_ADMISSION tensors=4' "$RUNNER_TEMP/bpb3-real-admission.txt"
      - name: Build immutable official ggml-base CPU encoder
        shell: bash
        env:
          GGML_SHA: f7591a6a01f9273de03331732bdc0b39721168be
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/llama-reference"
          git -C "$RUNNER_TEMP/llama-reference" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama-reference" -c credential.helper= fetch --no-tags --depth=1 origin "$GGML_SHA"
          git -C "$RUNNER_TEMP/llama-reference" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama-reference" rev-parse HEAD)" = "$GGML_SHA"
          cmake -S "$RUNNER_TEMP/llama-reference" -B "$RUNNER_TEMP/ggml-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF \
            -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/ggml-build" --target ggml-base -j 2
          LIB="$(find "$RUNNER_TEMP/ggml-build" -type f -name 'libggml-base.so*' | head -n 1)"
          test -n "$LIB"
          dirname "$LIB" > "$RUNNER_TEMP/bpb3-ggml-libdir.txt"
      - name: Evaluate paired DEV and untouched TEST on original trained model weights
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
          rustfmt --edition 2021 --check research/boolean-posit/reconstruction_e1.rs
          LIBDIR="$(cat "$RUNNER_TEMP/bpb3-ggml-libdir.txt")"
          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"
          rustc --edition=2021 -O research/boolean-posit/reconstruction_e1.rs \
            -L "native=$LIBDIR" -o "$RUNNER_TEMP/bpb3-e1-real"
          echo 'tensor,split,family,codec,rows,bpw,wire_bytes_per_256,rmse,nrmse_original_rms,mae,signed_bias,cosine,p95_abs,p99_abs,p999_abs,worst_index,max_abs,dot_rmse,zero_abs_mae,coefficients,dots' \
            > "$RUNNER_TEMP/bpb3-real-results.csv"
          for tensor in attention_output attention_qkv mlp_expansion mlp_projection; do
            "$RUNNER_TEMP/bpb3-e1-real" --external-f32le \
              "$RUNNER_TEMP/bpb3-pythia/selected/$tensor.f32le" \
              > "$RUNNER_TEMP/bpb3-$tensor.csv"
            grep -q '^protocol=bpb3-ggml-original-f32-e1-v1,dataset_kind=EXTERNAL_UNVERIFIED' \
              "$RUNNER_TEMP/bpb3-$tensor.csv"
            test "$(grep -c '^DEV,external,' "$RUNNER_TEMP/bpb3-$tensor.csv")" -eq 4
            test "$(grep -c '^TEST,external,' "$RUNNER_TEMP/bpb3-$tensor.csv")" -eq 4
            awk -v label="$tensor" 'NR > 2 { print label "," $0 }' \
              "$RUNNER_TEMP/bpb3-$tensor.csv" >> "$RUNNER_TEMP/bpb3-real-results.csv"
          done
          test "$(wc -l < "$RUNNER_TEMP/bpb3-real-results.csv")" -eq 33
          grep -q '^mlp_projection,TEST,external,GGUF_Q3_K' "$RUNNER_TEMP/bpb3-real-results.csv"
          sha256sum "$RUNNER_TEMP/bpb3-real-results.csv" \
            > "$RUNNER_TEMP/bpb3-real-csv-sha256.txt"
      - name: Retain real-weight reconstruction metrics and source manifest, not model weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3-e1-open-pythia-weights-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bpb3-real-results.csv
            ${{ runner.temp }}/bpb3-real-admission.txt
            ${{ runner.temp }}/bpb3-real-csv-sha256.txt
            ${{ runner.temp }}/bpb3-pythia/selected/manifest.json
          if-no-files-found: warn
          retention-days: 30
