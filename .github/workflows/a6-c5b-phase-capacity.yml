name: A6-C5b Boolean phase-memory capacity evidence

on:
  pull_request:
    branches:
      - main
      - research/a6-c5-recurrent-cycles-length-extrapolation

permissions:
  contents: read

concurrency:
  group: a6-c5b-phase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase-capacity:
    if: startsWith(github.head_ref, 'research/a6-c5b-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR revision without saved credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 and formatter
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify Rust formatting, compilation, lint and capacity tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_phase_capacity
          cargo test --locked -p sml-core --bin sml-phase-capacity-bench
      - name: A6-C5b independent width 1–4 and original 2-bit model evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C5B_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --locked --release -p sml-core --bin sml-phase-capacity-bench -- 5 2>&1 | tee "$RUNNER_TEMP/a6c5b-phase.log"
          grep -q '^A6C5B_ALL_FROZEN,true$' "$RUNNER_TEMP/a6c5b-phase.log"
          test "$(grep -c '^A6C5B_FROZEN,' "$RUNNER_TEMP/a6c5b-phase.log")" -eq 60
          test "$(grep -c '^A6C5B_TEST_RESULT,' "$RUNNER_TEMP/a6c5b-phase.log")" -eq 120
          test "$(grep -c '^A6C5B_SUMMARY,' "$RUNNER_TEMP/a6c5b-phase.log")" -eq 24
          grep '^A6C5B_SUMMARY,' "$RUNNER_TEMP/a6c5b-phase.log"
