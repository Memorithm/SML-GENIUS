name: A6-C8 dual hidden ANF terminal credit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a6-c8-joint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dual-hidden-credit:
    if: startsWith(github.head_ref, 'research/a6-c8-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR revision without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 formatter and Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify formatting, typecheck, strict Clippy and paired-gate native oracle
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_dual_hidden_credit
          cargo test --locked -p sml-core --bin sml-dual-hidden-credit-bench
      - name: A6-C8 train-only joint credit and frozen independent tests
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C8_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --locked --release -p sml-core --bin sml-dual-hidden-credit-bench -- 5 2>&1 | tee "$RUNNER_TEMP/a6c8-joint.log"
          grep -q '^A6C8_ALL_FROZEN,true$' "$RUNNER_TEMP/a6c8-joint.log"
          test "$(grep -c '^A6C8_FROZEN,' "$RUNNER_TEMP/a6c8-joint.log")" -eq 90
          test "$(grep -c '^A6C8_TEST_RESULT,' "$RUNNER_TEMP/a6c8-joint.log")" -eq 180
          test "$(grep -c '^A6C8_SUMMARY,' "$RUNNER_TEMP/a6c8-joint.log")" -eq 36
          grep '^A6C8_SUMMARY,' "$RUNNER_TEMP/a6c8-joint.log"
