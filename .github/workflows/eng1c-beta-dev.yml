name: ENG-1c beta depth exploration on DEV only
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  beta-dev-language:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'research/eng1c-beta-dev-')
    name: "Beta DEV only ${{ matrix.language }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        language: [FR, EN]
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Frozen grid, beta-one parity, independent oracle and DEV closure
        run: |
          test -s docs/ENG-1C-BETA-DEV-GRID-PROTOCOL.md
          bash -n scripts/eng1c/run-beta-dev.sh
          cargo fmt --all -- --check
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core --lib beta_ladder
          cargo test --locked -p sml-core --lib eng1c_dev
          cargo test --locked -p sml-core --lib eng1c_val1_ladder
          cargo test --locked -p sml-core --bin sml-eng1c-beta-dev
          cargo build --locked --release -p sml-core --bin sml-eng1c-beta-dev
      - name: Complete six-work registered TRAIN DEV grid
        env:
          BETA_LANGUAGE: ${{ matrix.language }}
        run: |
          bash scripts/eng1c/run-beta-dev.sh "$RUNNER_TEMP/beta-dev" "$BETA_LANGUAGE"
          test "$(find "$RUNNER_TEMP/beta-dev/evidence" -name '*-grid.txt' | wc -l)" -eq 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-dev-${{ matrix.language }}
          path: ${{ runner.temp }}/beta-dev/evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  beta-dev-panel:
    needs: beta-dev-language
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-dev-FR
          path: ${{ runner.temp }}/beta-dev-panel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-dev-EN
          path: ${{ runner.temp }}/beta-dev-panel
      - name: Require all twelve complete grids, descriptive DEV summary only
        run: |
          cargo build --locked --release -p sml-core --bin sml-eng1c-beta-dev
          target/release/sml-eng1c-beta-dev summarize "$RUNNER_TEMP/beta-dev-panel" "$RUNNER_TEMP/beta-dev-panel/summary.tsv"
          cat "$RUNNER_TEMP/beta-dev-panel/summary.tsv"
          grep -Fqx $'DECISION\tEXPLORATORY_DEV_GRID_ONLY\tselection_optimism=UNMEASURED\ttest=UNREAD\tintegrity=PASS' "$RUNNER_TEMP/beta-dev-panel/summary.tsv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-dev-complete-panel
          path: ${{ runner.temp }}/beta-dev-panel/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
