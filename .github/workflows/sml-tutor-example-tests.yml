name: SML TUTOR explicit example tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/sml-core/examples/sml_tutor_*.rs'
      - 'crates/sml-core/src/**'
      - 'crates/sml-core/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sml-tutor-example-tests.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sml-core/examples/sml_tutor_*.rs'
      - 'crates/sml-core/src/**'
      - 'crates/sml-core/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sml-tutor-example-tests.yml'
permissions:
  contents: read
concurrency:
  group: sml-tutor-example-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Explicitly execute all SML TUTOR example tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/sml-core/examples/sml_tutor_*.rs)
          test "${#files[@]}" -ge 4
          args=()
          for file in "${files[@]}"; do
            name="${file##*/}"
            args+=(--example "${name%.rs}")
          done
          cargo test --locked --release -p sml-core "${args[@]}"
      - name: Validate L2 induction through unchanged L1 executable
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage"' EXIT
          l1=crates/sml-core/fixtures/tutor-l1
          l2=crates/sml-core/fixtures/tutor-l2
          cargo run --locked --release -p sml-core --example sml_tutor_linguistic_roles -- "$l1/lexicon.txt" "$l1/train.txt" "$l1/test.txt" "$stage/l1.bank"
          cargo run --locked --release -p sml-core --example sml_tutor_lexicon_induction -- "$stage/l1.bank" "$l2/train.txt" "$stage/l2.bank" | tee "$stage/induction.txt"
          grep -Fx 'SML_TUTOR_LEXICON=PASS old=24 new=48 acquired=24 templates=8' "$stage/induction.txt"
          cargo run --locked --release -p sml-core --example sml_tutor_linguistic_roles -- --verify "$stage/l2.bank" "$l2/train.txt" "$l2/test.txt" | tee "$stage/novel.txt"
          grep -Fx 'SML_TUTOR_LINGUISTIC_RELOAD=PASS test=1024 errors=0' "$stage/novel.txt"
          cargo run --locked --release -p sml-core --example sml_tutor_linguistic_roles -- --verify "$stage/l2.bank" "$l1/train.txt" "$l1/test.txt" | tee "$stage/retained.txt"
          grep -Fx 'SML_TUTOR_LINGUISTIC_RELOAD=PASS test=896 errors=0' "$stage/retained.txt"
          cargo run --locked --release -p sml-core --example sml_tutor_linguistic_roles -- --predict "$stage/l1.bank" 'ivan compare karim' | grep -Fx ABSTAIN
          cargo run --locked --release -p sml-core --example sml_tutor_linguistic_roles -- --predict "$stage/l2.bank" 'ivan compare karim' | grep -Fx '8|8|10|0'
