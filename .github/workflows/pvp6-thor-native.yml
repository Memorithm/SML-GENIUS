name: PVP6 native Thor correctness

# PR correctness is mandatory in ci.yml on a fresh hosted VM. The same fixture
# script runs on integrated main on the managed self-hosted runner. Do not run
# candidate PR code or silently repeat an old timing campaign on persistent hosts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvp6-thor-native
  cancel-in-progress: false

jobs:
  thor-native:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ""
    steps:
      - name: Checkout exact integrated SML source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: sml-genius
          persist-credentials: false

      - name: Checkout pinned SciRust consumer without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/scirust
          ref: 9f229f09f4cb8a0776fe0af3fcf3ef341daa51f1
          path: scirust
          persist-credentials: false

      - name: Isolate toolchain and build homes
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTUP_HOME=$RUNNER_TEMP/pvp6-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/pvp6-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pvp6-sml-target" >> "$GITHUB_ENV"

      - name: Install pinned Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0

      - name: Record actual source and native host
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          test "$source" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          {
            printf 'source=%s\narch=%s\nmode=correctness_only\n' "$source" "$(uname -m)"
            printf 'scirust_source=%s\n' "$(git -C ../scirust rev-parse HEAD)"
            rustc +1.89.0 --version --verbose
            cargo +1.89.0 --version
          } | tee ../pvp6-thor-source.txt

      - name: Generate and admit unchanged frozen fixture and model executor
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked --release -p sml-core \
            --example pascal_boolean_pb8_gate_bank -- pvp6-fixture > ../pvp6_fixture.csv
          expected='feb1a144e23d9a29439b7cad6704f56637a7f7ead1a9b9abb39ad9c0ac5325fd'
          actual="$(sha256sum ../pvp6_fixture.csv | awk '{print $1}')"
          test "$actual" = "$expected"
          printf 'fixture_sha256=%s\n' "$actual" | tee ../pvp6-thor-admission.txt
          bash scripts/check-pvp6-fixture.sh | tee ../pvp6-thor-executor.log

      - name: Run pinned SciRust structural admission
        working-directory: scirust
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pvp6-scirust-target
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked --release -p scirust-simd \
            --example pvp6_fixture_check -- --fixture ../pvp6_fixture.csv \
            | tee ../pvp6-scirust-admission.json

      - name: Publish correctness evidence only
        if: always()
        shell: bash
        run: |
          {
            echo '### PVP6 native destination correctness — no timing campaign'
            cat pvp6-thor-source.txt 2>/dev/null || true
            cat pvp6-thor-admission.txt 2>/dev/null || true
            cat pvp6-thor-executor.log 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-bound correctness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pvp6-thor-correctness-${{ github.sha }}
          path: |
            pvp6-thor-source.txt
            pvp6-thor-admission.txt
            pvp6-thor-executor.log
            pvp6-scirust-admission.json
          if-no-files-found: error
