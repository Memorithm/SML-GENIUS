name: A6-C10 nonlinear paired ANF system identification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a6-c10-system-id-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  joint-nonlinear-id:
    if: startsWith(github.head_ref, 'research/a6-c10-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact source revision without saved GitHub credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Check format, compilation, Clippy and causal test fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_joint_nonlinear_system_id -- --nocapture
          cargo test --locked -p sml-core --bin sml-joint-nonlinear-id-bench
      - name: A6-C10 100 frozen train/val and 200 independent 4k-16k tests
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C10_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --release --locked -p sml-core --bin sml-joint-nonlinear-id-bench -- 5 2>&1 | tee "$RUNNER_TEMP/a6c10-system-id.log"
          grep -q '^A6C10_ALL_FROZEN,true$' "$RUNNER_TEMP/a6c10-system-id.log"
          test "$(grep -c '^A6C10_FROZEN,' "$RUNNER_TEMP/a6c10-system-id.log")" -eq 100
          test "$(grep -c '^A6C10_TEST_RESULT,' "$RUNNER_TEMP/a6c10-system-id.log")" -eq 200
          test "$(grep -c '^A6C10_SUMMARY,' "$RUNNER_TEMP/a6c10-system-id.log")" -eq 40
          grep '^A6C10_SUMMARY,' "$RUNNER_TEMP/a6c10-system-id.log"
