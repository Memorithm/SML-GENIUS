name: G1 realtext smoke

# SMOKE ONLY. Runs the flagged `g1_latency_rss --realtext` arm on the
# hand-written in-repo fixture (crates/sml-store/tests/fixtures/g1_realtext/
# smoke.{manifest,tsv}, sha256 6d8212da...5b65) and checks exit 0 plus meta
# substrings. Printed timings/RSS/recall on a 5-segment fixture on a shared
# GitHub-hosted VM are NOT measurements and must not be cited. Fixture smoke
# != validation; every real corpus remains NOT_MEASURED. No corpus download.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: g1rt-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  g1-realtext-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89.0
      - name: Run --realtext on in-repo smoke fixture (smoke only, not a measurement)
        shell: bash
        run: |
          set -euo pipefail
          F=crates/sml-store/tests/fixtures/g1_realtext
          echo "6d8212da1faeb7269eaf7caf0ee207cc6653d9a0fa2805cc56d5d45193e15b65  $F/smoke.tsv" | sha256sum -c -
          cargo run --locked --release -p sml-store --example g1_latency_rss -- \
            --realtext "$F/smoke.manifest" "$F/smoke.tsv" > "$RUNNER_TEMP/g1rt.out"
          meta=$(grep -E '^G1_LAT_META ' "$RUNNER_TEMP/g1rt.out")
          for s in synthetic=false arm=realtext corpus_id=g1-smoke-fixture-handwritten key=simhash64-sha256-v1; do
            grep -qF -- " $s" <<<"$meta" || { echo "missing meta: $s"; exit 1; }
          done
          echo "G1 realtext smoke: exit 0, meta OK. Timings are SMOKE ONLY, not measurements (NOT_MEASURED)." >> "$GITHUB_STEP_SUMMARY"
