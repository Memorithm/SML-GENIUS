name: BPB3-K direct bitplane dot oracle

on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_direct.rs'
      - 'research/boolean-posit/bpb3k_prepared_bench.rs'
      - 'research/boolean-posit/bpb3k.rs'
      - 'research/boolean-posit/gguf_k.rs'
      - 'research/boolean-posit/BPB3_K_DIRECT_DOT.md'
      - '.github/workflows/bpb3k-direct-dot.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/bpb3k_direct.rs'
      - 'research/boolean-posit/bpb3k_prepared_bench.rs'
      - 'research/boolean-posit/bpb3k.rs'
      - 'research/boolean-posit/gguf_k.rs'
      - '.github/workflows/bpb3k-direct-dot.yml'

permissions:
  contents: read

jobs:
  exact-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned research toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Verify Rust formatting
        run: rustup run 1.89.0 rustfmt --edition 2021 --check research/boolean-posit/bpb3k_direct.rs research/boolean-posit/bpb3k_prepared_bench.rs
      - name: Build direct-dot test oracle (warnings denied)
        run: rustup run 1.89.0 rustc --edition=2021 -D warnings --test research/boolean-posit/bpb3k_direct.rs -o "$RUNNER_TEMP/bpb3k-direct-tests"
      - name: Execute independent Q3_K dot parity and regression tests
        shell: bash
        run: |
          "$RUNNER_TEMP/bpb3k-direct-tests" --nocapture
      - name: Compile optimized standalone Rust library
        run: rustup run 1.89.0 rustc --edition=2021 -D warnings -O --crate-type lib research/boolean-posit/bpb3k_direct.rs -o "$RUNNER_TEMP/libbpb3k_direct.rlib"

      - name: Build native optimized Q8-prepared amortization diagnostic
        run: rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=native research/boolean-posit/bpb3k_prepared_bench.rs -o "$RUNNER_TEMP/bpb3k-q8-prepared-bench"
      - name: Paired standalone Q8 benchmark with unchanged outputs (not model qualification)
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 90s "$RUNNER_TEMP/bpb3k-q8-prepared-bench" | tee "$RUNNER_TEMP/bpb3k-q8-prepared-bench.txt"
          grep -q '^BPB3K_Q8_BENCH_VERDICT=DIAGNOSTIC' "$RUNNER_TEMP/bpb3k-q8-prepared-bench.txt"
