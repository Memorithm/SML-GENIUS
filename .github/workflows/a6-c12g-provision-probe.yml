name: A6-C12g runner provisioning diagnosis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'research/a6-c12g-')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    timeout-minutes: 5
    steps:
      - name: Confirm runner was provisioned
        run: |
          echo "A6C12G_RUNNER_REACHED os=${{ matrix.os }} sha=${{ github.event.pull_request.head.sha }}"
          uname -a
