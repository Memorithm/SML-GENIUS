name: WideSparseANF SBG MOR DeltaKV atomic integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: anf-wide-coupled-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wide-coupled:
    if: startsWith(github.head_ref, 'research/anf-wide-sbg-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR SHA with no persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Rust 1.89 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Check Rust formatting compilation and strict lints
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
      - name: Verify selected SBG page, real MOR route, DKV and rollback
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sml-core --lib wide_anf_selected_pages -- --nocapture
          cargo test --locked -p sml-core --lib wide_anf_delta_kv -- --nocapture
          cargo test --locked -p sml-core --lib wide_anf_routed -- --nocapture
          cargo test --locked -p sml-core --lib anf_wide_sparse -- --nocapture
          echo 'WIDE_SBG_COMPLETE,selected_page_k1024=true,immutable_sbg_snapshot=true,mor_routed=true,delta_kv_dynamic=true,atomic_rollback=true'
