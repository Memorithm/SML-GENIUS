name: BPB3-K unsigned-offset bitplanes AVX2 native stock comparison
on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_offset32_avx2.rs'
      - 'research/boolean-posit/bpb3k_offset32_stock_bench.rs'
      - 'research/boolean-posit/BPB3_K_OFFSET32.md'
      - '.github/workflows/bpb3k-offset32-avx2.yml'
  push:
    paths:
      - 'research/boolean-posit/bpb3k_offset32_avx2.rs'
      - 'research/boolean-posit/bpb3k_offset32_stock_bench.rs'
      - 'research/boolean-posit/BPB3_K_OFFSET32.md'
      - '.github/workflows/bpb3k-offset32-avx2.yml'
permissions:
  contents: read
jobs:
  exact-threeway-stocksimd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact untrusted head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Rustfmt plus signed original-Q3_K integer oracle, extremes and unaligned offsets
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustfmt --edition 2021 --check \
            research/boolean-posit/bpb3k_offset32_avx2.rs \
            research/boolean-posit/bpb3k_offset32_stock_bench.rs
          rustup run 1.89.0 rustc --edition=2021 -D warnings --test \
            research/boolean-posit/bpb3k_offset32_avx2.rs \
            -o "$RUNNER_TEMP/bpb3k-offset32-tests"
          "$RUNNER_TEMP/bpb3k-offset32-tests" --nocapture
      - name: Actual Haswell instructions and no AVX512 popcount
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            --crate-type lib --emit=asm \
            research/boolean-posit/bpb3k_offset32_avx2.rs \
            -o "$RUNNER_TEMP/bpb3k-offset32-haswell.s"
          grep -Eiq 'vpshufb' "$RUNNER_TEMP/bpb3k-offset32-haswell.s"
          grep -Eiq 'vpmaddubsw' "$RUNNER_TEMP/bpb3k-offset32-haswell.s"
          grep -Eiq 'vpmaddwd' "$RUNNER_TEMP/bpb3k-offset32-haswell.s"
          ! grep -Eiq 'vpopcnt' "$RUNNER_TEMP/bpb3k-offset32-haswell.s"
          if grep -Eiq 'vpbroadcastd' "$RUNNER_TEMP/bpb3k-offset32-haswell.s"; then
            echo 'BPB3K_OFFSET_ASM_BROADCASTD=OBSERVED'
          else
            echo 'BPB3K_OFFSET_ASM_BROADCASTD=NOT_OBSERVED_NEEDS_CODEGEN_REVIEW'
          fi
          echo 'PASS_BPB3K_OFFSET_HASWELL_ISA pshufb=true maddubs=true maddwd=true avx512_popcount=false'
      - name: Source-integrity pinned original Q3_K AVX2 and tiled C oracle
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/bpb3k-ggml"
          git -C "$RUNNER_TEMP/bpb3k-ggml" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 5s 240s git -C "$RUNNER_TEMP/bpb3k-ggml" fetch --depth=1 --no-tags origin f7591a6a01f9273de03331732bdc0b39721168be
          git -C "$RUNNER_TEMP/bpb3k-ggml" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bpb3k-ggml" rev-parse HEAD)" = f7591a6a01f9273de03331732bdc0b39721168be
          bash research/boolean-posit/run_bpb3k_stock_oracle.sh \
            "$RUNNER_TEMP/bpb3k-ggml" "$RUNNER_TEMP/bpb3k-stock" fused_v2_stock
      - name: Compile benchmark at exact Haswell ISA
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            research/boolean-posit/bpb3k_offset32_stock_bench.rs \
            -L "native=$RUNNER_TEMP/bpb3k-stock" -l static=original_q3 \
            -o "$RUNNER_TEMP/bpb3k-offset32-stock-bench"
      - name: Three-way 1024 exact source rows and 96 paired triplets
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 120s "$RUNNER_TEMP/bpb3k-offset32-stock-bench" | tee "$RUNNER_TEMP/bpb3k-offset32-stock-bench.txt"
          grep -q '^PASS_BPB3K_OFFSET_THREEWAY_ORACLE ' "$RUNNER_TEMP/bpb3k-offset32-stock-bench.txt"
          test "$(grep -c '^BPB3K_OFFSET_RAW ' "$RUNNER_TEMP/bpb3k-offset32-stock-bench.txt")" = 96
          test "$(grep -c '^BPB3K_OFFSET_SUMMARY ' "$RUNNER_TEMP/bpb3k-offset32-stock-bench.txt")" = 4
          grep -q '^BPB3K_OFFSET_VERDICT=DIAGNOSTIC ' "$RUNNER_TEMP/bpb3k-offset32-stock-bench.txt"
