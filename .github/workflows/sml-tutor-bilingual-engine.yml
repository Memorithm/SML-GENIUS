name: SML TUTOR bilingual engine integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/sml-tutor/**'
      - 'crates/sml-core/examples/sml_tutor_linguistic_roles.rs'
      - 'crates/sml-core/examples/sml_tutor_dialogue/**'
      - 'crates/sml-core/fixtures/tutor-l1/**'
      - 'crates/sml-core/fixtures/tutor-en-l1/**'
      - '.github/workflows/sml-tutor-bilingual-engine.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sml-tutor/**'
      - 'crates/sml-core/examples/sml_tutor_linguistic_roles.rs'
      - 'crates/sml-core/examples/sml_tutor_dialogue/**'
      - 'crates/sml-core/fixtures/tutor-l1/**'
      - 'crates/sml-core/fixtures/tutor-en-l1/**'
      - '.github/workflows/sml-tutor-bilingual-engine.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Native engine and frozen L1 learner
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p sml-tutor
          cargo build --locked --release -p sml-core --example sml_tutor_linguistic_roles
          cargo build --locked --release -p sml-tutor --example sml_tutor_bilingual_l1 --example sml_tutor_mixed_l1_anf
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage"' EXIT
          native="$PWD/target/release/examples/sml_tutor_linguistic_roles"
          bridge="$PWD/target/release/examples/sml_tutor_bilingual_l1"
          for lang in fr en; do
            if [[ "$lang" = fr ]]; then src=crates/sml-core/fixtures/tutor-l1; else src=crates/sml-core/fixtures/tutor-en-l1; fi
            mkdir "$stage/$lang"
            cp "$src/lexicon.txt" "$src/test.txt" "$stage/$lang/"
            cp "$src/train.txt" "$stage/$lang/oracle-train.txt"
            python3 - "$src/train.txt" "$stage/$lang/train.txt" <<'PY'
          import sys
          from pathlib import Path
          rows = Path(sys.argv[1]).read_text().splitlines()
          assert len(rows) == 192
          selected = [rows[v * 32 + (v % 4) * 8 + p] for v in range(6) for p in range(8)]
          assert len(set(selected)) == 48
          Path(sys.argv[2]).write_text("\n".join(selected) + "\n")
          PY
            "$native" "$stage/$lang/lexicon.txt" "$stage/$lang/train.txt" "$stage/$lang/test.txt" "$stage/$lang/linguistic.bank"
          done
          fr_sha="$(sha256sum "$stage/fr/linguistic.bank" | cut -d' ' -f1)"
          en_sha="$(sha256sum "$stage/en/linguistic.bank" | cut -d' ' -f1)"
          for workers in 1 2; do
            "$bridge" "$native" "$stage/store-$workers" "$stage/fr" "$stage/en" "$fr_sha" "$en_sha" "$workers" | tee "$stage/result-$workers.txt"
            grep -Fx "SML_TUTOR_L1_ENGINE=PASS languages=2 workers=$workers learned_annotations=96 held_out=1792 store_entries=2 reopen_unchanged=true" "$stage/result-$workers.txt"
          done
          cmp "$stage/store-1/store/HEAD" "$stage/store-2/store/HEAD"
          mixed="$PWD/target/release/examples/sml_tutor_mixed_l1_anf"
          for workers in 1 2; do
            "$mixed" "$native" "$stage/mixed-$workers" "$stage/fr" "$stage/en" "$fr_sha" "$en_sha" "$workers" | tee "$stage/mixed-$workers.txt"
            grep -Fx "SML_TUTOR_MIXED=PASS fr=1 en=1 math=6 rust=0 workers=$workers store_entries=8 reopen_unchanged=true" "$stage/mixed-$workers.txt"
          done
          cmp "$stage/mixed-1/store/HEAD" "$stage/mixed-2/store/HEAD"
          # Actual supervisor: first cycle admits FR/EN and four mathematical
          # functions. The second process reads both language banks directly
          # and consolidates four more functions in the same store.
          cargo build --locked --release -p sml-tutor --bin sml-tutord
          daemon="$PWD/target/release/sml-tutord"
          for workers in 1 2; do
            timeout 180s "$daemon" root="$stage/cumulative-mixed" cumulative_math=1 plan_ahead=1 max_cycles=1 per_domain=4 inputs=7 degree=2 workers="$workers" min_mem_gib=0 min_disk_gib=0 max_load_per_cpu=100 archive_cycles=1 l1_native="$native" l1_fr="$stage/fr" l1_en="$stage/en" l1_fr_sha="$fr_sha" l1_en_sha="$en_sha" | tee "$stage/cumulative-$workers.txt"
          done
          python3 - "$stage/cumulative-mixed" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          h = json.loads((root / "health.json").read_text())
          assert h["new_certified_total"] == 8, h
          assert h["reexamined_total"] == 8, h
          assert h["jobs"]["succeeded"] == 2, h
          store = root / "cumulative-math-v1"
          version, digest = (store / "HEAD").read_text().splitlines()[1].split()
          assert version == "2"
          def manifest(d):
              raw = (store / "manifests" / d).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == d
              lines = raw.decode().splitlines()
              return lines[2].split()[1], {r.split()[1]: r for r in lines[3:]}
          parent, latest = manifest(digest)
          _, old = manifest(parent)
          assert len(old) == 6 and len(latest) == 10
          assert all(latest[k] == v for k, v in old.items())
          hashes = {r.split()[-1] for r in latest.values()}
          for lang in ("fr", "en"):
              expected = hashlib.sha256((root.parent / lang / "linguistic.bank").read_bytes()).hexdigest()
              assert expected in hashes
              assert hashlib.sha256((store / "objects" / expected).read_bytes()).hexdigest() == expected
          assert len(list((root / "archive").glob("*.smlpack"))) == 2
          print("SML_TUTORD_CUMULATIVE_MIXED=PASS math_new=8 l1_banks=2 reexamined=8 store_entries=10 version=2")
          PY
          grep -q 'l1_retained=2 l1_cases=1792 exact_replay=false' "$stage/cumulative-2.txt"
          # The annotation teacher is not authoritative. A validly formatted
          # incorrect role label must not enter the store as a certified bank.
          sed -i '1s/|0$/|1/' "$stage/fr/train.txt"
          if "$bridge" "$native" "$stage/rejected" "$stage/fr" "$stage/en" "$fr_sha" "$en_sha" 2; then
            echo "incorrect annotation was admitted" >&2
            exit 1
          fi
