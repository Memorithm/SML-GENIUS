name: BPB-3 A3 independent SmolLM2 paired quantization
on:
  pull_request:
    paths: ['research/boolean-posit/bpb3_adaptive_a3_paired.rs', 'research/boolean-posit/smollm2_adaptive_corpus.py', '.github/workflows/bpb3-adaptive-a3-smollm2.yml']
  push:
    branches: [main]
    paths: ['research/boolean-posit/bpb3_adaptive_a3_paired.rs', 'research/boolean-posit/smollm2_adaptive_corpus.py', '.github/workflows/bpb3-adaptive-a3-smollm2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a3-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Static contract, Rust 1.89 format and metadata compilation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
          python3 -m py_compile research/boolean-posit/smollm2_adaptive_corpus.py
          rustfmt --edition 2021 --check research/boolean-posit/bpb3_adaptive_a3_paired.rs
          rustc --edition 2021 -D warnings --crate-type lib --emit metadata research/boolean-posit/bpb3_adaptive_a3_paired.rs -o "$RUNNER_TEMP/bpb3-a3.rmeta"
  a3-smollm2-reconstruction:
    needs: a3-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned NumPy and Hub client
        run: |
          python3 -m venv "$RUNNER_TEMP/a3-venv"
          "$RUNNER_TEMP/a3-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6 huggingface_hub==0.35.3 hf_xet==1.1.10
      - name: Download, hash-check and select independent original model weights
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a3-model"
          export A3_MODEL_DIR="$RUNNER_TEMP/a3-model"
          "$RUNNER_TEMP/a3-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(repo_id="HuggingFaceTB/SmolLM2-135M", revision="93efa2f097d58c2a74874c7e644dbc9b0cee75a2", filename="model.safetensors", local_dir=os.environ["A3_MODEL_DIR"]))
          PY
          echo '80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1  '"$RUNNER_TEMP/a3-model/model.safetensors" | sha256sum -c -
          "$RUNNER_TEMP/a3-venv/bin/python" research/boolean-posit/smollm2_adaptive_corpus.py "$RUNNER_TEMP/a3-model/model.safetensors" "$RUNNER_TEMP/a3-model/selected" | tee "$RUNNER_TEMP/a3-admission.txt"
          grep -q '^PASS_A3_SMOLLM2_PINNED tensors=4 dev=24 test=24' "$RUNNER_TEMP/a3-admission.txt"
      - name: Build immutable unmodified CPU ggml encoder
        shell: bash
        env:
          GGML_SHA: f7591a6a01f9273de03331732bdc0b39721168be
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/a3-ggml"
          git -C "$RUNNER_TEMP/a3-ggml" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 5s 240s git -C "$RUNNER_TEMP/a3-ggml" -c credential.helper= fetch --no-tags --depth=1 origin "$GGML_SHA"
          git -C "$RUNNER_TEMP/a3-ggml" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/a3-ggml" rev-parse HEAD)" = "$GGML_SHA"
          cmake -S "$RUNNER_TEMP/a3-ggml" -B "$RUNNER_TEMP/a3-build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/a3-build" --target ggml-base -j 2
          LIB="$(find "$RUNNER_TEMP/a3-build" -type f -name 'libggml-base.so*' | head -n 1)"
          test -n "$LIB"
          dirname "$LIB" > "$RUNNER_TEMP/a3-libdir.txt"
      - name: Compare source and identical bipolar dot masks for all four codecs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
          LIBDIR="$(cat "$RUNNER_TEMP/a3-libdir.txt")"
          export LD_LIBRARY_PATH="$LIBDIR"
          rustc --edition 2021 -D warnings --test research/boolean-posit/bpb3_adaptive_a3_paired.rs -L "native=$LIBDIR" -o "$RUNNER_TEMP/a3-tests"
          "$RUNNER_TEMP/a3-tests" --nocapture | tee "$RUNNER_TEMP/a3-tests.txt"
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/a3-tests.txt"
          rustc --edition 2021 -D warnings -O research/boolean-posit/bpb3_adaptive_a3_paired.rs -L "native=$LIBDIR" -o "$RUNNER_TEMP/a3-eval"
          echo 'tensor,split,codec,payload_bytes,bits_per_weight,weight_rmse,dot_rmse,coefficients,dots,mode1_blocks,mode2_blocks,mode3_blocks' > "$RUNNER_TEMP/a3-results.csv"
          for tensor in attention_output_layer2 attention_q_layer2 mlp_up_layer3 mlp_down_layer3; do
            FILE="$RUNNER_TEMP/a3-model/selected/$tensor.f32le"
            test "$(stat -c %s "$FILE")" -eq 49152
            "$RUNNER_TEMP/a3-eval" --external-f32le "$FILE" | tee "$RUNNER_TEMP/a3-$tensor.csv"
            grep -q '^protocol=bpb3-a3-smollm2-135m-v1' "$RUNNER_TEMP/a3-$tensor.csv"
            test "$(grep -c '^DEV,' "$RUNNER_TEMP/a3-$tensor.csv")" -eq 4
            test "$(grep -c '^TEST,' "$RUNNER_TEMP/a3-$tensor.csv")" -eq 4
            awk -v tensor="$tensor" 'NR>2 {print tensor "," $0}' "$RUNNER_TEMP/a3-$tensor.csv" >> "$RUNNER_TEMP/a3-results.csv"
          done
          test "$(wc -l < "$RUNNER_TEMP/a3-results.csv")" -eq 33
          sha256sum "$RUNNER_TEMP/a3-results.csv" "$RUNNER_TEMP/a3-tests.txt" > "$RUNNER_TEMP/a3-hashes.txt"
          echo PASS_A3_INDEPENDENT_MODEL_SAME_MASK_DOT
      - name: Archive provenance and metrics without model weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3-a3-smollm2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/a3-results.csv
            ${{ runner.temp }}/a3-tests.txt
            ${{ runner.temp }}/a3-hashes.txt
            ${{ runner.temp }}/a3-admission.txt
            ${{ runner.temp }}/a3-model/selected/manifest.json
          if-no-files-found: warn
          retention-days: 30
