name: ENG-1a exact collision-free long-context Witten-Bell qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eng1a-long-ngram-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-long-context:
    if: startsWith(github.head_ref, 'research/eng1a-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Read-only checkout of the exact untrusted PR HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Rust 1.89, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact-head formatting, compile and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
      - name: Long suffix/oracle and existing reference regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sml-core --lib elastic_ngram_long -- --nocapture
          cargo test --locked -p sml-core --lib elastic_ngram::tests -- --nocapture
