name: Trusted RSI review adapter
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  primary-provider-owner-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Memorithm/SciRust-Verify
          ref: 662a30dc774dd19c68a79bed3889036a91930123
          path: owner
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
      - run: cargo build --locked --manifest-path owner/Cargo.toml -p scirust-verify-cli
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Qualify actual provider, owner authentication and human-only consumer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SML_PUBLICATION_OWNER: ${{ github.workspace }}/owner/target/debug/scirust-verify
          SML_REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SML_REVIEW_PR: ${{ github.event.pull_request.number || 0 }}
          SML_REVIEW_EVIDENCE: ${{ runner.temp }}/trusted-review-qualification.json
        run: cargo test --locked -p sml-publication --test promotion_owner_e2e -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/trusted-review-qualification.json
          if-no-files-found: error
