name: BPB3-K Q4 146 160 and paired 228 AVX2 original-Q3_K comparison
on:
  push:
    paths:
      - 'research/boolean-posit/bpb3k_q4_pair228_avx2.rs'
      - 'research/boolean-posit/bpb3k_q4_pair228_stock_bench.rs'
      - 'research/boolean-posit/bpb3k_q4_streaming_stock_bench.rs'
      - 'research/boolean-posit/bpb3k_preencoded114_avx2.rs'
      - 'research/boolean-posit/BPB3_K_Q4_PAIR228.md'
      - '.github/workflows/bpb3k-q4-pair228-avx2.yml'
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_q4_pair228_avx2.rs'
      - 'research/boolean-posit/bpb3k_q4_pair228_stock_bench.rs'
      - 'research/boolean-posit/bpb3k_preencoded114_avx2.rs'
      - 'research/boolean-posit/BPB3_K_Q4_PAIR228.md'
      - '.github/workflows/bpb3k-q4-pair228-avx2.yml'
permissions:
  contents: read
jobs:
  original-q3-versus-146-160-228:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head, no persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Enforce rustfmt and independent original Q3_K source wire parity
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustfmt --edition 2021 --check \
            research/boolean-posit/bpb3k_q4_pair228_avx2.rs \
            research/boolean-posit/bpb3k_q4_pair228_stock_bench.rs \
            research/boolean-posit/bpb3k_q4_streaming_stock_bench.rs \
            research/boolean-posit/bpb3k_preencoded114_avx2.rs
          rustup run 1.89.0 rustc --edition=2021 -D warnings --test \
            research/boolean-posit/bpb3k_q4_pair228_avx2.rs \
            -o "$RUNNER_TEMP/bpb3k-q4-pair228-tests"
          "$RUNNER_TEMP/bpb3k-q4-pair228-tests" --nocapture
      - name: Inspect actual monomorphized Haswell SIMD ISA
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            --emit=asm research/boolean-posit/bpb3k_q4_pair228_stock_bench.rs \
            -o "$RUNNER_TEMP/bpb3k-q4-pair228.s"
          for op in vpmaddubsw vpmaddwd vpshufb vperm2i128 vpbroadcast; do
            count="$(grep -Eic "$op" "$RUNNER_TEMP/bpb3k-q4-pair228.s" || true)"
            echo "BPB3K_Q4_ASM_OPCODE=$op COUNT=$count"
          done
          ! grep -Eiq 'vpopcnt' "$RUNNER_TEMP/bpb3k-q4-pair228.s"
          echo 'BPB3K_Q4_AMD64_ISA=HASWELL_NO_AVX512'
      - name: Fetch pinned unchanged original optimized Q3_K C oracle
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/llama-q3-native"
          git -C "$RUNNER_TEMP/llama-q3-native" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 5s 240s git -C "$RUNNER_TEMP/llama-q3-native" fetch --depth=1 --no-tags origin f7591a6a01f9273de03331732bdc0b39721168be
          git -C "$RUNNER_TEMP/llama-q3-native" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama-q3-native" rev-parse HEAD)" = f7591a6a01f9273de03331732bdc0b39721168be
          bash research/boolean-posit/run_bpb3k_stock_oracle.sh \
            "$RUNNER_TEMP/llama-q3-native" "$RUNNER_TEMP/bpb3k-original-stock" fused_v2_stock
      - name: Build optimized native Q3_K linked multi-arm Rust comparison
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            research/boolean-posit/bpb3k_q4_pair228_stock_bench.rs \
            -L "native=$RUNNER_TEMP/bpb3k-original-stock" -l static=original_q3 \
            -o "$RUNNER_TEMP/bpb3k-q4-pair228-bench"
      - name: Run original-C exact and 144 balanced timing groups
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 120s "$RUNNER_TEMP/bpb3k-q4-pair228-bench" | tee "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt"
          grep -q '^PASS_Q4_SINGLE_ORACLE=1024 ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt"
          grep -q '^PASS_PAIR228_ORACLE=512 ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt"
          test "$(grep -c '^Q4_RAW ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt")" = 72
          test "$(grep -c '^PAIR228_RAW ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt")" = 72
          test "$(grep -c '^Q4_SUMMARY ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt")" = 3
          test "$(grep -c '^PAIR228_SUMMARY ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt")" = 3
          grep -q '^Q4_PAIR228_VERDICT=DIAGNOSTIC ' "$RUNNER_TEMP/bpb3k-q4-pair228-result.txt"

      - name: Build and run 262144-row independent contiguous weight streaming arrays
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            research/boolean-posit/bpb3k_q4_streaming_stock_bench.rs \
            -L "native=$RUNNER_TEMP/bpb3k-original-stock" -l static=original_q3 \
            -o "$RUNNER_TEMP/bpb3k-q4-stream-bench"
          timeout -k 5s 120s "$RUNNER_TEMP/bpb3k-q4-stream-bench" | tee "$RUNNER_TEMP/bpb3k-q4-stream-result.txt"
          grep -q '^PASS_Q4_STREAM_ORACLE ' "$RUNNER_TEMP/bpb3k-q4-stream-result.txt"
          test "$(grep -c '^Q4_STREAM_RAW ' "$RUNNER_TEMP/bpb3k-q4-stream-result.txt")" = 12
          grep -q '^Q4_STREAM_SUMMARY ' "$RUNNER_TEMP/bpb3k-q4-stream-result.txt"
          grep -q '^Q4_STREAM_VERDICT=DIAGNOSTIC ' "$RUNNER_TEMP/bpb3k-q4-stream-result.txt"
