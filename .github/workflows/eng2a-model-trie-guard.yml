name: ENG-2a SML-owned exact trie precommit gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eng2a-trie-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  model-owned-guard:
    if: startsWith(github.head_ref, 'research/eng2a-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source from untrusted PR read-only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Rust 1.89 formatting and Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact source identity and strict Rust compilation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version
          cargo fmt --all -- --check
          cargo check --locked -p sml-core -p sml-elastic-bench --all-targets
          cargo clippy --locked -p sml-core -p sml-elastic-bench --all-targets -- -D warnings
      - name: Exercise complete class-vector gate and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sml-elastic-bench eng2_trie_gate -- --nocapture
          cargo test --locked -p sml-elastic-bench --lib
          cargo test --locked -p sml-core --lib elastic_ngram_trie
          cargo test --locked -p sml-core --lib elastic_ngram_long
      - name: Explicitly classify this gate as non-actuating
        shell: bash
        run: |
          echo 'ENG2A_RESULT=MODEL_OWNED_PRECOMMIT_GUARD_ONLY'
          echo 'ENG2A_ACTUATION=NONE'
          echo 'ENG2A_BUDGET=LOGICAL_COUNTS_ONLY'
          echo 'ENG2A_REAL_TEXT=NOT_EVALUATED'
