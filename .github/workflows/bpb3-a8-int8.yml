name: BPB-3 A8 signed INT8 Boolean POPCOUNT correctness

on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3_a8_int8.rs'
      - 'research/boolean-posit/BPB3_A8_INT8_PROTOCOL_20261112.md'
      - '.github/workflows/bpb3-a8-int8.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/bpb3_a8_int8.rs'
      - 'research/boolean-posit/BPB3_A8_INT8_PROTOCOL_20261112.md'
      - '.github/workflows/bpb3-a8-int8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-signed-int8:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Rust 1.89
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
      - name: Format Boolean INT8 source
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check research/boolean-posit/bpb3_a8_int8.rs
      - name: Exact signed-INT8 Boolean dot and tensor matvec oracles
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 -D warnings --test research/boolean-posit/bpb3_a8_int8.rs -o "$RUNNER_TEMP/bpb3-a8-int8-tests"
          "$RUNNER_TEMP/bpb3-a8-int8-tests" --nocapture | tee "$RUNNER_TEMP/bpb3-a8-int8-test-output.txt"
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/bpb3-a8-int8-test-output.txt"
      - name: Preserve exact-head integer oracle result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3-a8-int8-${{ github.sha }}
          path: ${{ runner.temp }}/bpb3-a8-int8-test-output.txt
          if-no-files-found: warn
          retention-days: 21
