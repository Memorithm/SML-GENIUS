name: BPB3-K Q8_K cached subgroup sums AVX2 exact oracle and original-stock benchmark
on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_bsums_avx2.rs'
      - 'research/boolean-posit/bpb3k_bsums_stock_bench.rs'
      - 'research/boolean-posit/BPB3_K_BSUMS_AVX2.md'
      - '.github/workflows/bpb3k-bsums-avx2.yml'
  push:
    paths:
      - 'research/boolean-posit/bpb3k_bsums_avx2.rs'
      - 'research/boolean-posit/bpb3k_bsums_stock_bench.rs'
      - 'research/boolean-posit/BPB3_K_BSUMS_AVX2.md'
      - '.github/workflows/bpb3k-bsums-avx2.yml'
permissions:
  contents: read
jobs:
  exact-stock-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head with no persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Format and independent integer oracles including corrupted cache and unaligned inputs
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustfmt --edition 2021 --check \
            research/boolean-posit/bpb3k_bsums_avx2.rs \
            research/boolean-posit/bpb3k_bsums_stock_bench.rs
          rustup run 1.89.0 rustc --edition=2021 -D warnings --test \
            research/boolean-posit/bpb3k_bsums_avx2.rs \
            -o "$RUNNER_TEMP/bpb3k-bsums-unit-tests"
          "$RUNNER_TEMP/bpb3k-bsums-unit-tests" --nocapture
      - name: Audit actual generated Haswell ISA without AVX512
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            --crate-type lib --emit=asm \
            research/boolean-posit/bpb3k_bsums_avx2.rs \
            -o "$RUNNER_TEMP/bpb3k-bsums-haswell.s"
          grep -Eiq 'vpshufb' "$RUNNER_TEMP/bpb3k-bsums-haswell.s"
          grep -Eiq 'vpmaddubsw' "$RUNNER_TEMP/bpb3k-bsums-haswell.s"
          grep -Eiq 'vpmaddwd' "$RUNNER_TEMP/bpb3k-bsums-haswell.s"
          ! grep -Eiq 'vpopcnt' "$RUNNER_TEMP/bpb3k-bsums-haswell.s"
          echo 'PASS_BPB3K_BSUMS_HASWELL_ISA pshufb=true maddubs=true maddwd=true avx512_popcount=false'
          echo 'BPB3K_BSUMS_SPILL_PORT_VERDICT=NOT_QUALIFIED'
      - name: Fetch unchanged pinned upstream original C AVX2 and C++ tiled oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git init -q "$RUNNER_TEMP/bpb3k-ggml"
          git -C "$RUNNER_TEMP/bpb3k-ggml" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 5s 240s git -C "$RUNNER_TEMP/bpb3k-ggml" fetch --depth=1 --no-tags origin f7591a6a01f9273de03331732bdc0b39721168be
          git -C "$RUNNER_TEMP/bpb3k-ggml" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bpb3k-ggml" rev-parse HEAD)" = f7591a6a01f9273de03331732bdc0b39721168be
          bash research/boolean-posit/run_bpb3k_stock_oracle.sh \
            "$RUNNER_TEMP/bpb3k-ggml" "$RUNNER_TEMP/bpb3k-stock" fused_v2_stock
      - name: Build optimized three-way benchmark for Haswell with original Q3_K C
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=haswell \
            research/boolean-posit/bpb3k_bsums_stock_bench.rs \
            -L "native=$RUNNER_TEMP/bpb3k-stock" -l static=original_q3 \
            -o "$RUNNER_TEMP/bpb3k-bsums-bench"
      - name: Exact original-Q3 parity and 96 paired three-way timing triplets
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 120s "$RUNNER_TEMP/bpb3k-bsums-bench" | tee "$RUNNER_TEMP/bpb3k-bsums-bench.txt"
          grep -q '^PASS_BPB3K_BSUMS_THREEWAY_ORACLE ' "$RUNNER_TEMP/bpb3k-bsums-bench.txt"
          test "$(grep -c '^BPB3K_BSUMS_RAW ' "$RUNNER_TEMP/bpb3k-bsums-bench.txt")" = 96
          test "$(grep -c '^BPB3K_BSUMS_SUMMARY ' "$RUNNER_TEMP/bpb3k-bsums-bench.txt")" = 4
          grep -q '^BPB3K_BSUMS_VERDICT=DIAGNOSTIC ' "$RUNNER_TEMP/bpb3k-bsums-bench.txt"
