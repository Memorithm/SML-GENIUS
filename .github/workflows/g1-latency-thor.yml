name: G1 CONTEXT-3 latency/RSS native self-hosted five-run bench

# Trusted integrated main ONLY. Never execute pull-request code on persistent
# self-hosted hosts. Repeats the #810 `g1_latency_rss` example (synthetic
# fixture, unchanged harness) 5 times at N=16384 on the self-hosted runner and
# uploads raw stdout + host provenance. No metric is promoted or generalized.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g1-latency-thor.yml
  workflow_dispatch:
    inputs:
      segments:
        description: "N segments (>=16000)"
        default: "16384"
      queries:
        description: "queries per cell"
        default: "256"

permissions:
  contents: read

concurrency:
  group: g1-latency-native-self-hosted
  cancel-in-progress: false

jobs:
  g1-latency:
    if: >-
      github.repository == 'Memorithm/SML-GENIUS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      G1_SEGMENTS: ${{ github.event.inputs.segments || '16384' }}
      G1_QUERIES: ${{ github.event.inputs.queries || '256' }}
      G1_RUNS: "5"
    steps:
      - name: Fail closed on ref and parameters before source materialization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Memorithm/SML-GENIUS'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$G1_SEGMENTS" =~ ^[0-9]+$ ]] && test "$G1_SEGMENTS" -ge 16000
          [[ "$G1_QUERIES" =~ ^[0-9]+$ ]] && test "$G1_QUERIES" -ge 1
      - name: Checkout exact trusted main commit (read-only Git credentials)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: sml-genius
      - name: Record host provenance
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/g1-latency"; mkdir -p "$out"
          {
            echo "G1_NATIVE_SOURCE_SHA=$GITHUB_SHA"
            echo "G1_NATIVE_EXAMPLE_BLOB=$(git rev-parse HEAD:crates/sml-store/examples/g1_latency_rss.rs)"
            echo "G1_NATIVE_RUNNER_NAME=$RUNNER_NAME"
            echo "G1_NATIVE_HOST=$(hostname)"
            echo "G1_NATIVE_ARCH=$(uname -m)"
            echo "G1_NATIVE_KERNEL=$(uname -r)"
            echo "G1_NATIVE_CPUS=$(nproc)"
            echo "G1_NATIVE_CPU_MODEL=$( (lscpu 2>/dev/null | awk -F: '/Model name/{gsub(/^ +/,"",$2);print $2;exit}') || echo unknown)"
            echo "G1_NATIVE_PRE_LOADAVG=$(cat /proc/loadavg)"
            awk '/^MemAvailable:/{print "G1_NATIVE_PRE_MEMAVAILABLE_KIB=" $2}' /proc/meminfo
            echo "G1_NATIVE_SEGMENTS=$G1_SEGMENTS G1_NATIVE_QUERIES=$G1_QUERIES G1_NATIVE_RUNS=$G1_RUNS"
          } | tee "$out/provenance.txt"
      - name: Isolate Rust/Cargo caches and build directory
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTUP_HOME=$RUNNER_TEMP/g1-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/g1-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/g1-target" >> "$GITHUB_ENV"
      - name: Install pinned Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Build unchanged release example once
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.89.0 --version | tee -a "$RUNNER_TEMP/g1-latency/provenance.txt"
          cargo +1.89.0 build --locked --release -p sml-store --example g1_latency_rss
          test -x "$CARGO_TARGET_DIR/release/examples/g1_latency_rss"
      - name: Execute five independent processes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-latency"
          for i in $(seq 1 "$G1_RUNS"); do
            echo "G1_NATIVE_RUN_START run=$i loadavg=$(cat /proc/loadavg)" | tee -a "$out/runs-console.txt"
            "$CARGO_TARGET_DIR/release/examples/g1_latency_rss" "$G1_SEGMENTS" "$G1_QUERIES" | tee "$out/run-$i.txt"
            grep -q '^G1_LAT_PROCESS ' "$out/run-$i.txt"
          done
          echo "G1_NATIVE_POST_LOADAVG=$(cat /proc/loadavg)" | tee -a "$out/provenance.txt"
          test "$(ls "$out"/run-*.txt | wc -l)" = "$G1_RUNS"
      - name: Publish raw summary (no derived verdict)
        if: always()
        shell: bash
        run: |
          {
            echo '### G1 CONTEXT-3 native latency/RSS (synthetic, raw, five processes)'
            echo '```'
            cat "$RUNNER_TEMP/g1-latency/provenance.txt" 2>/dev/null || true
            cat "$RUNNER_TEMP/g1-latency"/run-*.txt 2>/dev/null || true
            echo '```'
            echo 'Synthetic fixture only; not LONGCTX-B1; host-specific; no promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw outputs and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-latency-native-${{ github.sha }}
          path: ${{ runner.temp }}/g1-latency/
          if-no-files-found: warn
          retention-days: 30
