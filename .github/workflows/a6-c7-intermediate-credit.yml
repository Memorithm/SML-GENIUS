name: A6-C7 intermediate ANF credit at 128-256 state bits

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a6-c7-hidden-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intermediate-credit:
    if: startsWith(github.head_ref, 'research/a6-c7-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR source without saved credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify formatter, native ANF oracle, Clippy and benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_intermediate_credit
          cargo test --locked -p sml-core --bin sml-intermediate-credit-bench
      - name: A6-C7 70 frozen hidden-gate models and 140 independent long tests
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C7_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --release --locked -p sml-core --bin sml-intermediate-credit-bench -- 5 2>&1 | tee "$RUNNER_TEMP/a6c7-hidden-credit.log"
          grep -q '^A6C7_ALL_FROZEN,true$' "$RUNNER_TEMP/a6c7-hidden-credit.log"
          test "$(grep -c '^A6C7_FROZEN,' "$RUNNER_TEMP/a6c7-hidden-credit.log")" -eq 70
          test "$(grep -c '^A6C7_TEST_RESULT,' "$RUNNER_TEMP/a6c7-hidden-credit.log")" -eq 140
          test "$(grep -c '^A6C7_SUMMARY,' "$RUNNER_TEMP/a6c7-hidden-credit.log")" -eq 28
          grep '^A6C7_SUMMARY,' "$RUNNER_TEMP/a6c7-hidden-credit.log"
