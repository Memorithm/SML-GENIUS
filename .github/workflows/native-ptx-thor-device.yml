name: Native NVIDIA PTX hardware qualification on Jetson Thor

# Trusted, integrated main code only. NEVER execute unreviewed PR code
# on a persistent ARM64 host; this workflow is intentionally not PR-triggered.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-ptx-thor-device.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sml-native-ptx-jetson-thor
  cancel-in-progress: false

jobs:
  thor-ptx-hardware:
    if: >-
      github.repository == 'Memorithm/SML-GENIUS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SML_NATIVE_GPU_TEST: "1"
    steps:
      - name: Fail closed unless on expected Jetson Thor host and trusted main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Memorithm/SML-GENIUS'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(uname -m)" = 'aarch64'
          test "$(hostname)" = 'tarek'
          echo "SML_NATIVE_THOR_HOST=$(hostname)"
          echo "SML_NATIVE_THOR_ARCH=$(uname -m)"
          echo "SML_NATIVE_THOR_KERNEL=$(uname -r)"
          echo "SML_NATIVE_THOR_DRIVER_DIAGNOSTIC_BEGIN"
          if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi -L || true; fi
          ls -l /dev/nvhost-ctrl-gpu /dev/nvidia0 2>/dev/null || true
          echo "SML_NATIVE_THOR_DRIVER_DIAGNOSTIC_END"
          available="$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)"
          test -n "$available"
          test "$available" -ge 2097152
          echo "SML_NATIVE_THOR_MEMAVAILABLE_KIB=$available"

      - name: Checkout exact integrated main without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: sml-genius

      - name: Pin executable PTX and CUDA-driver host adapter bytecode source
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:crates/sml-native-kernels/ptx/boolean_words.ptx)" = '12e7715c92caac7ad21deb361c6aa474b00df535'
          test "$(git rev-parse HEAD:crates/sml-native-kernels/src/cuda_driver.rs)" = '323745d01571b6d3ced09c0d939ba9f141142f7d'
          test "$(git rev-parse HEAD:crates/sml-native-kernels/src/lib.rs)" = '64875c559112fee2eb8603206fa27a3afbf4b825'
          echo "SML_NATIVE_GPU_SOURCE_SHA=$GITHUB_SHA"
          echo 'SML_NATIVE_GPU_FROZEN_PTX_BLOB=12e7715c92caac7ad21deb361c6aa474b00df535'

      - name: Isolate Cargo and Rust caches for reproducible device qualification
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTUP_HOME=$RUNNER_TEMP/sml-ptx-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/sml-ptx-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sml-ptx-target" >> "$GITHUB_ENV"

      - name: Install pinned Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0

      - name: Compile native ARM64 and dynamically linked CUDA driver adapter
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.89.0 -vV
          cargo +1.89.0 build --locked --release -p sml-native-kernels --features cuda-driver

      - name: Diagnose actual CUDA-driver PTX JIT compiler messages
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/sml-native-thor-jit.txt"
          import ctypes
          from pathlib import Path

          cuda = ctypes.CDLL("libcuda.so.1")
          cuda.cuInit.argtypes = [ctypes.c_uint]
          cuda.cuDeviceGet.argtypes = [ctypes.POINTER(ctypes.c_int), ctypes.c_int]
          cuda.cuCtxCreate_v2.argtypes = [ctypes.POINTER(ctypes.c_void_p), ctypes.c_uint, ctypes.c_int]
          cuda.cuCtxDestroy_v2.argtypes = [ctypes.c_void_p]
          cuda.cuModuleLoadDataEx.argtypes = [
              ctypes.POINTER(ctypes.c_void_p), ctypes.c_void_p,
              ctypes.c_uint, ctypes.POINTER(ctypes.c_int), ctypes.POINTER(ctypes.c_void_p),
          ]
          cuda.cuModuleUnload.argtypes = [ctypes.c_void_p]
          status = cuda.cuInit(0)
          print(f"PTX_JIT_DRIVER_INIT={status}")
          if status != 0: raise SystemExit(0)
          device = ctypes.c_int()
          status = cuda.cuDeviceGet(ctypes.byref(device), 0)
          print(f"PTX_JIT_DEVICE_GET={status},device={device.value}")
          if status != 0: raise SystemExit(0)
          context = ctypes.c_void_p()
          status = cuda.cuCtxCreate_v2(ctypes.byref(context), 0, device.value)
          print(f"PTX_JIT_CONTEXT_CREATE={status}")
          if status != 0: raise SystemExit(0)
          try:
              source = Path("crates/sml-native-kernels/ptx/boolean_words.ptx").read_bytes()
              ptx = ctypes.create_string_buffer(source + bytes([0]))
              err = ctypes.create_string_buffer(8192)
              info = ctypes.create_string_buffer(8192)
              # CUDA CUjit_option enum: error log 5, error size 6,
              # info log 3, info size 4. Sizes are pointer-valued scalars.
              options = (ctypes.c_int * 4)(5, 6, 3, 4)
              values = (ctypes.c_void_p * 4)(
                  ctypes.cast(err, ctypes.c_void_p).value, 8192,
                  ctypes.cast(info, ctypes.c_void_p).value, 8192,
              )
              module = ctypes.c_void_p()
              status = cuda.cuModuleLoadDataEx(
                  ctypes.byref(module), ctypes.cast(ptx, ctypes.c_void_p),
                  4, options, values,
              )
              print(f"PTX_JIT_MODULE_LOAD_EX={status}")
              print("PTX_JIT_ERROR_LOG=" + err.value.decode("utf-8", "replace"))
              print("PTX_JIT_INFO_LOG=" + info.value.decode("utf-8", "replace"))
              if status == 0 and module.value:
                  cuda.cuModuleUnload(module)
          finally:
              cuda.cuCtxDestroy_v2(context)
          PY

      - name: Execute PTX on real NVIDIA GPU and compare against exact Rust oracle
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          test "$SML_NATIVE_GPU_TEST" = '1'
          cargo +1.89.0 test --locked -p sml-native-kernels --features cuda-driver -- --nocapture
          echo "SML_NATIVE_THOR_PTX_REAL_DEVICE_TEST=PASS"

      - name: Repeat PTX kernel execution including roundtrip timing
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked --release -p sml-native-kernels --features cuda-driver --example native_bitkernels \
            | tee "$RUNNER_TEMP/sml-native-thor-results.txt"
          grep -Eq 'gpu_roundtrip,operation=Xor3,words=1031,nanos_total=[0-9]+,exact=true' "$RUNNER_TEMP/sml-native-thor-results.txt"
          grep -Eq 'gpu_roundtrip,operation=Hamming,words=1031,nanos_total=[0-9]+,exact=true' "$RUNNER_TEMP/sml-native-thor-results.txt"
          grep -Eq 'gpu_roundtrip,operation=TernaryPartial,words=1031,nanos_total=[0-9]+,exact=true' "$RUNNER_TEMP/sml-native-thor-results.txt"
          echo "SML_NATIVE_THOR_PTX_ALL_3_OPERATIONS=PASS"

      - name: Resident CUDA context and device-event measurement (real GPU)
        working-directory: sml-genius
        shell: bash
        run: |
          set -euo pipefail
          test "$SML_NATIVE_GPU_TEST" = '1'
          cargo +1.89.0 run --locked --release -p sml-native-kernels --features cuda-driver --example native_resident_gpu \
            | tee "$RUNNER_TEMP/sml-native-thor-resident-results.txt"
          grep -qx 'SML_NATIVE_RESIDENT_THOR_ALL_OPERATIONS=PASS' "$RUNNER_TEMP/sml-native-thor-resident-results.txt"
          for words in 1031 65536; do
            for operation in Xor3 Hamming TernaryPartial; do
              grep -Eq "^SML_NATIVE_RESIDENT,operation=${operation},words=${words},.*exact=true$" "$RUNNER_TEMP/sml-native-thor-resident-results.txt"
            done
          done
          test "$(grep -c '^SML_NATIVE_RESIDENT,operation=' "$RUNNER_TEMP/sml-native-thor-resident-results.txt")" = 6
          echo 'SML_NATIVE_THOR_RESIDENT_DEVICE_EVENTS=PASS'

      - name: Publish trustworthy source-bound device evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### SML NVIDIA PTX real Jetson Thor device qualification'
            echo "Source: $GITHUB_SHA"
            echo "Host: $(hostname)"
            echo "Arch: $(uname -m)"
            echo "Kernel: $(uname -r)"
            echo "Explicit GPU test enabled: $SML_NATIVE_GPU_TEST"
            cat "$RUNNER_TEMP/sml-native-thor-results.txt" 2>/dev/null || true
            cat "$RUNNER_TEMP/sml-native-thor-resident-results.txt" 2>/dev/null || true
            echo 'PTX device tests must pass before promotion; no inference integration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact GPU test and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sml-native-thor-ptx-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sml-native-thor-results.txt
            ${{ runner.temp }}/sml-native-thor-jit.txt
            ${{ runner.temp }}/sml-native-thor-resident-results.txt
          if-no-files-found: warn
          retention-days: 30
