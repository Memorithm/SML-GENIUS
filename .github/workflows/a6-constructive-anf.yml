name: A6 constructive ANF gate learning evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a6-constructive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  constructive:
    if: startsWith(github.head_ref, 'research/a6-constructive-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR revision without saved credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify formatting, compilation, lint and causal gate tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_constructive
          cargo test --locked -p sml-core --bin sml-constructive-gates-bench
      - name: Independent-seed constructive gate experiment
        shell: bash
        run: |
          set -euo pipefail
          echo "A6_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --locked --release -p sml-core --bin sml-constructive-gates-bench -- 5 2>&1 | tee "$RUNNER_TEMP/a6-constructive.log"
          grep -q '^A6_ALL_FROZEN,true$' "$RUNNER_TEMP/a6-constructive.log"
          test "$(grep -c '^A6_GATE_FROZEN,' "$RUNNER_TEMP/a6-constructive.log")" -eq 20
          test "$(grep -c '^A6_CASE_RESULT,' "$RUNNER_TEMP/a6-constructive.log")" -eq 20
          test "$(grep -c '^A6_SUMMARY,' "$RUNNER_TEMP/a6-constructive.log")" -eq 4
          grep '^A6_SUMMARY,' "$RUNNER_TEMP/a6-constructive.log"
