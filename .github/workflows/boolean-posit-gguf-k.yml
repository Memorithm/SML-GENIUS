name: BPB-3 GGUF Q3_K Q4_K official decoder parity

on:
  pull_request:
    paths:
      - 'research/boolean-posit/gguf_k*'
      - 'research/boolean-posit/GGUF_K_CONTRACT.md'
      - '.github/workflows/boolean-posit-gguf-k.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/gguf_k*'
      - 'research/boolean-posit/GGUF_K_CONTRACT.md'
      - '.github/workflows/boolean-posit-gguf-k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-q3-q4-decode-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust 1.89 formatting and oracle tests
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
          rustfmt --edition 2021 --check research/boolean-posit/gguf_k.rs research/boolean-posit/gguf_k_vectors.rs
          rustc --edition=2021 --test research/boolean-posit/gguf_k.rs -o "$RUNNER_TEMP/gguf-k-tests"
          "$RUNNER_TEMP/gguf-k-tests"
          rustc --edition=2021 -O research/boolean-posit/gguf_k_vectors.rs -o "$RUNNER_TEMP/gguf-k-vectors"
          "$RUNNER_TEMP/gguf-k-vectors" --fixture-vectors > "$RUNNER_TEMP/gguf-k-vectors.csv"
          test "$(wc -l < "$RUNNER_TEMP/gguf-k-vectors.csv")" -eq 2560
      - name: Fetch and verify upstream ggml/gguf-py immutable revision
        env:
          GGUF_REF_SHA: f7591a6a01f9273de03331732bdc0b39721168be
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gguf-reference"
          git -C "$RUNNER_TEMP/gguf-reference" init --quiet
          git -C "$RUNNER_TEMP/gguf-reference" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/gguf-reference" -c credential.helper= fetch --no-tags --depth=1 origin "$GGUF_REF_SHA"
          git -C "$RUNNER_TEMP/gguf-reference" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gguf-reference" rev-parse HEAD)" = "$GGUF_REF_SHA"
          test -f "$RUNNER_TEMP/gguf-reference/gguf-py/gguf/quants.py"
      - name: Compare all decoded coefficients with official gguf-py
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gguf-venv"
          "$RUNNER_TEMP/gguf-venv/bin/pip" install --disable-pip-version-check numpy==2.2.6
          "$RUNNER_TEMP/gguf-venv/bin/python" research/boolean-posit/gguf_k_reference.py \
            "$RUNNER_TEMP/gguf-reference" "$RUNNER_TEMP/gguf-k-vectors.csv" \
            | tee "$RUNNER_TEMP/gguf-k-official-parity.txt"
          grep -q '^PASS_GGUF_K_OFFICIAL_PYTHON_PARITY' "$RUNNER_TEMP/gguf-k-official-parity.txt"
      - name: Publish reference qualification without model/GPU claims
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3-gguf-k-decode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gguf-k-official-parity.txt
            ${{ runner.temp }}/gguf-k-vectors.csv
          if-no-files-found: warn
          retention-days: 30
