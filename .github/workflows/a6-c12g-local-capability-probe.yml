name: A6-C12g trusted Dell capability probe (no checkout)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a6-c12g-local-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capability:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'CHECKUPAUTO' &&
      startsWith(github.head_ref, 'research/a6-c12g-')
    runs-on: [self-hosted, Linux, X64, remoteops, dell-t430]
    timeout-minutes: 5
    steps:
      - name: Report only Rust and container availability without checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C12G_LOCAL_PROBE,runner=$RUNNER_NAME,arch=$(uname -m)"
          for tool in cargo rustc rustfmt rustup podman docker; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "A6C12G_TOOL,$tool=$(command -v "$tool")"
            else
              echo "A6C12G_TOOL,$tool=missing"
            fi
          done
