name: Posit8 full ADD MUL Boolean circuit synthesis and native ISA

on:
  pull_request:
    paths:
      - 'research/boolean-posit/posit8_bdd_synth.rs'
      - 'research/boolean-posit/posit8_x86_64_emit.rs'
      - 'research/boolean-posit/posit8_complement_edges.rs'
      - 'research/boolean-posit/POSIT8_BDD_ADD_MUL_PROTOCOL_20261112.md'
      - '.github/workflows/bpb3-posit8-bdd.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/posit8_bdd_synth.rs'
      - 'research/boolean-posit/posit8_x86_64_emit.rs'
      - 'research/boolean-posit/posit8_complement_edges.rs'
      - 'research/boolean-posit/POSIT8_BDD_ADD_MUL_PROTOCOL_20261112.md'
      - '.github/workflows/bpb3-posit8-bdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-add-mul-native-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Rust 1.89 pinned
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup default 1.89.0
      - name: Exact formatting
        run: rustfmt --edition 2021 --check research/boolean-posit/posit8_bdd_synth.rs
      - name: Exhaustive BDD synthesis and Rust correctness
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 -O -D warnings --test research/boolean-posit/posit8_bdd_synth.rs -o "$RUNNER_TEMP/posit8-bdd-tests"
          "$RUNNER_TEMP/posit8-bdd-tests" --nocapture | tee "$RUNNER_TEMP/posit8-bdd-tests.txt"
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/posit8-bdd-tests.txt"
          rustc --edition 2021 -O -D warnings research/boolean-posit/posit8_bdd_synth.rs -o "$RUNNER_TEMP/posit8-bdd-gen"
          "$RUNNER_TEMP/posit8-bdd-gen" | tee "$RUNNER_TEMP/posit8-bdd-summary.txt"
          grep -q 'POSIT8_BDD_add PASS' "$RUNNER_TEMP/posit8-bdd-summary.txt"
          grep -q 'POSIT8_BDD_mul PASS' "$RUNNER_TEMP/posit8-bdd-summary.txt"
      - name: Compile discovered Boolean ADD and MUL to native machine instructions
        shell: bash
        run: |
          set -euo pipefail
          for op in add mul; do
            echo "Compiling native Boolean circuit for posit8 $op"
            SRC="$RUNNER_TEMP/posit8-learned-$op.rs"
            "$RUNNER_TEMP/posit8-bdd-gen" "--emit-$op" > "$SRC"
            rustc --edition 2021 -D warnings -C opt-level=2 --crate-type=lib --emit=asm "$SRC" -o "$RUNNER_TEMP/posit8-learned-$op.s"
            grep -q "learned_posit8_$op" "$RUNNER_TEMP/posit8-learned-$op.s"
            cat >> "$SRC" <<RS
          #[path = "$GITHUB_WORKSPACE/research/boolean-posit/posit8_circuit_synth.rs"]
          #[allow(dead_code)]
          mod original_posit_oracle;
          #[cfg(test)]
          mod generated_circuit_validation {
              use super::*;
              #[test]
              fn all_65536_posit8_inputs() {
                  for a in 0..=255u8 {
                      for b in 0..=255u8 {
                          let actual = learned_posit8_$op(a,b);
                          let reference = if "$op" == "add" {
                              original_posit_oracle::Posit8(a).add(original_posit_oracle::Posit8(b)).0
                          } else {
                              original_posit_oracle::Posit8(a).mul(original_posit_oracle::Posit8(b)).0
                          };
                          assert_eq!(actual, reference, "a={a} b={b}");
                      }
                  }
              }
          }
          RS
            rustc --edition 2021 -O -D warnings --test "$SRC" -o "$RUNNER_TEMP/posit8-native-$op-test"
            "$RUNNER_TEMP/posit8-native-$op-test" --nocapture | tee "$RUNNER_TEMP/posit8-native-$op-check.txt"
            grep -Fq 'test generated_circuit_validation::all_65536_posit8_inputs ... ok' "$RUNNER_TEMP/posit8-native-$op-check.txt"
            grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/posit8-native-$op-check.txt"
          done
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: posit8-bdd-add-mul-${{ github.sha }}
          path: |
            ${{ runner.temp }}/posit8-bdd-tests.txt
            ${{ runner.temp }}/posit8-bdd-summary.txt
            ${{ runner.temp }}/posit8-learned-add.rs
            ${{ runner.temp }}/posit8-learned-mul.rs
            ${{ runner.temp }}/posit8-learned-add.s
            ${{ runner.temp }}/posit8-learned-mul.s
            ${{ runner.temp }}/posit8-native-add-check.txt
            ${{ runner.temp }}/posit8-native-mul-check.txt
          if-no-files-found: warn
          retention-days: 21
