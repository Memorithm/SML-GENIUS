name: BPB3-K prepared Q8 versus pinned stock AVX2 dot

on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_prepared_stock_bench.rs'
      - 'research/boolean-posit/bpb3k_direct.rs'
      - 'research/boolean-posit/bpb3k.rs'
      - 'research/boolean-posit/run_bpb3k_stock_oracle.sh'
      - 'research/boolean-posit/BPB3_K_DIRECT_DOT.md'
      - '.github/workflows/bpb3k-prepared-vs-stock-dot.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/bpb3k_prepared_stock_bench.rs'
      - 'research/boolean-posit/bpb3k_direct.rs'
      - '.github/workflows/bpb3k-prepared-vs-stock-dot.yml'

permissions:
  contents: read

jobs:
  exact-stock-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposed head without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Verify diagnostic source formatting
        run: rustup run 1.89.0 rustfmt --edition 2021 --check research/boolean-posit/bpb3k_prepared_stock_bench.rs
      - name: Fetch exact upstream ggml C oracle and verify pin
        shell: bash
        run: |
          set -euo pipefail
          sha=f7591a6a01f9273de03331732bdc0b39721168be
          git init -q "$RUNNER_TEMP/pinned-llama"
          git -C "$RUNNER_TEMP/pinned-llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 10s 180s git -C "$RUNNER_TEMP/pinned-llama" -c credential.helper= fetch --depth=1 --no-tags origin "$sha"
          git -C "$RUNNER_TEMP/pinned-llama" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-llama" rev-parse HEAD)" = "$sha"
      - name: Compile and qualify unchanged pinned C AVX2 stock function
        shell: bash
        run: |
          set -euo pipefail
          bash research/boolean-posit/run_bpb3k_stock_oracle.sh \
            "$RUNNER_TEMP/pinned-llama" "$RUNNER_TEMP/stock-oracle" stock_vector \
            | tee "$RUNNER_TEMP/pinned-oracle-control.txt"
          grep -q '^PASS_BPB3K_ORIGINAL_AVX2_ORACLE' "$RUNNER_TEMP/pinned-oracle-control.txt"
      - name: Build optimized cross-language microbenchmark
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.89.0 rustc --edition=2021 -D warnings -O -C target-cpu=native \
            research/boolean-posit/bpb3k_prepared_stock_bench.rs \
            -L "native=$RUNNER_TEMP/stock-oracle" -l static=original_q3 \
            -o "$RUNNER_TEMP/stock-vs-prepared"
      - name: Run paired exact-stock versus prepared Q8 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PINNED_UPSTREAM_SHA=f7591a6a01f9273de03331732bdc0b39721168be"
            echo "PR_HEAD_SHA=$(git rev-parse HEAD)"
            timeout -k 10s 120s "$RUNNER_TEMP/stock-vs-prepared"
          } | tee "$RUNNER_TEMP/bpb3k-stock-vs-prepared.txt"
          grep -q '^BPB3K_STOCK_VERDICT=DIAGNOSTIC' "$RUNNER_TEMP/bpb3k-stock-vs-prepared.txt"
      - name: Retain raw measurements and independent C oracle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3k-stock-vs-prepared-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bpb3k-stock-vs-prepared.txt
            ${{ runner.temp }}/pinned-oracle-control.txt
          if-no-files-found: warn
          retention-days: 30
