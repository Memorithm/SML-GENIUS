name: A6-C12g one-shot Rust formatting (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'CHECKUPAUTO' && startsWith(github.head_ref, 'research/a6-c12g-noise-sample-phase-transition')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same-repository trusted PR head for autoformat
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Rustfmt stable pinned version
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Autoformat only preregistered experiment and push style-only change
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'research/a6-c12g-noise-sample-phase-transition'
          cargo fmt --all
          CHANGED="$(git diff --name-only)"
          if test -z "$CHANGED"; then
            echo "A6-C12g Rust already formatted; no push."
            exit 0
          fi
          test "$CHANGED" = 'crates/sml-core/src/bin/sml-noise-sample-phase-bench.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/sml-core/src/bin/sml-noise-sample-phase-bench.rs
          git commit -m 'style(A6-C12g): apply pinned Rust 1.89 formatting'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
