name: A6-C12c subexhaustive sketch-MITM at 508 sources

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: a6-c12c-sketch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sketch-mitm-508:
    if: startsWith(github.head_ref, 'research/a6-c12c-')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 pinned toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify Rust formatting compilation strict Clippy and native controls
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --all-targets
          cargo clippy --locked -p sml-core --all-targets -- -D warnings
          cargo test --locked -p sml-core anf_three_gate_diagnostic
          cargo test --locked -p sml-core --bin sml-sketch-mitm-bench
      - name: Frozen three-grid 272-policy comparison and 508 source exhaustive reference
        shell: bash
        run: |
          set -euo pipefail
          echo "A6C12C_ENV,sha=$(git rev-parse HEAD),runner=$RUNNER_NAME,arch=$(uname -m),rust=$(rustc --version),cpus=$(nproc)"
          cargo run --locked --release -p sml-core --bin sml-sketch-mitm-bench -- 3 2>&1 | tee "$RUNNER_TEMP/a6c12c-sketch.log"
          grep -q '^A6C12C_ALL_FROZEN,policies=272,streams=24$' "$RUNNER_TEMP/a6c12c-sketch.log"
          test "$(grep -c '^A6C12C_GRID,' "$RUNNER_TEMP/a6c12c-sketch.log")" -eq 72
          test "$(grep -c '^A6C12C_FROZEN,' "$RUNNER_TEMP/a6c12c-sketch.log")" -eq 272
          test "$(grep -c '^A6C12C_TEST,' "$RUNNER_TEMP/a6c12c-sketch.log")" -eq 272
          test "$(grep -c '^A6C12C_FROZEN,.*n=508,method=walsh3_stream,' "$RUNNER_TEMP/a6c12c-sketch.log")" -eq 8
          grep -q '^A6C12C_COMPLETE,policies=272,independent_test_streams=24,grid_sizes=3,methods=4$' "$RUNNER_TEMP/a6c12c-sketch.log"
          grep '^A6C12C_TEST,' "$RUNNER_TEMP/a6c12c-sketch.log" | grep ',n=508,method=hybrid_w2_mitm,' || true
