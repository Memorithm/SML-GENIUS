name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Contract probe
        run: cargo run -p sml-cli -- contract
      - name: SML-0.1 smoke
        run: cargo run -p sml-cli -- sml01-smoke
      - name: SML-0.2 smoke
        run: cargo run -p sml-cli -- sml02-smoke
      - name: SML-0.3 smoke
        run: cargo run -p sml-cli -- sml03-smoke
      - name: SML-0.4 smoke
        run: cargo run -p sml-cli -- sml04-smoke
      - name: SML-0.5 smoke
        run: cargo run -p sml-cli -- sml05-smoke
