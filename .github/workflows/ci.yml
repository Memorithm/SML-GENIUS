          cargo run --locked --release -p sml-core --example dkv_2a_n8_hybrid > "$RUNNER_TEMP/dkv-2a-n8-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n8-first.csv" "$RUNNER_TEMP/dkv-2a-n8-second.csv"
