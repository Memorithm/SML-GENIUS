      - name: DKV-2a-N9 multi-expert domain evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n9')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n9_multiexpert > "$RUNNER_TEMP/dkv-2a-n9-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n9_multiexpert > "$RUNNER_TEMP/dkv-2a-n9-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n9-first.csv" "$RUNNER_TEMP/dkv-2a-n9-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n9-first.csv"
      - name: DKV-2a-N10 route-hybrid evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n10')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n10_route_hybrid > "$RUNNER_TEMP/dkv-2a-n10-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n10_route_hybrid > "$RUNNER_TEMP/dkv-2a-n10-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n10-first.csv" "$RUNNER_TEMP/dkv-2a-n10-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n10-first.csv"
      - name: DKV-2a-N11 two-bank resolver evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n11-')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n11_two_bank > "$RUNNER_TEMP/dkv-2a-n11-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n11_two_bank > "$RUNNER_TEMP/dkv-2a-n11-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n11-first.csv" "$RUNNER_TEMP/dkv-2a-n11-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n11-first.csv"
      - name: DKV-2a-N12 verified identity evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n12-')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-store --example dkv_2a_n12_verified_identity > "$RUNNER_TEMP/dkv-2a-n12-first.csv"
          cargo run --locked --release -p sml-store --example dkv_2a_n12_verified_identity > "$RUNNER_TEMP/dkv-2a-n12-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n12-first.csv" "$RUNNER_TEMP/dkv-2a-n12-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n12-first.csv"
      - name: DKV-2a-N13A prototype-native census evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n13a-')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n13a_runtime_census > "$RUNNER_TEMP/dkv-2a-n13a-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n13a_runtime_census > "$RUNNER_TEMP/dkv-2a-n13a-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n13a-first.csv" "$RUNNER_TEMP/dkv-2a-n13a-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n13a-first.csv"
      - name: Delta-KV dynamic re-keying evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p sml-core --example dkv_2c_dynamic > "$RUNNER_TEMP/dkv-2c-first.csv"
          cargo run --locked -p sml-core --example dkv_2c_dynamic > "$RUNNER_TEMP/dkv-2c-second.csv"
          cmp "$RUNNER_TEMP/dkv-2c-first.csv" "$RUNNER_TEMP/dkv-2c-second.csv"
          cat "$RUNNER_TEMP/dkv-2c-first.csv"
      - name: Native RAM materialization evidence
        run: cargo test --locked -p sml-runtime -- --nocapture
      - name: Mapped semantic store evidence
        run: cargo test --locked -p sml-store -- --nocapture
      - name: Context streaming ingest evidence
        run: cargo test --locked -p sml-store --test context_ingest -- --nocapture
      - name: Context semantic/provenance emission evidence
        run: cargo test --locked -p sml-store --test context_semantic_ingest -- --nocapture
      - name: Lockfile reproducibility
        run: bash scripts/check-lockfile.sh
      - name: SBG-0.12 packed semantic benchmark
        if: startsWith(github.head_ref, 'research/sbg-0.12')
        run: cargo run --locked --release -p sml-cli -- sbg012-bench
      - name: SBG-0.12 code-generation audit
        if: startsWith(github.head_ref, 'research/sbg-0.12')
        run: bash scripts/audit-sbg012-codegen.sh
      - name: Contract probe
        run: cargo run --locked -p sml-cli -- contract
      - name: SML-0.1 smoke
        run: cargo run --locked -p sml-cli -- sml01-smoke
      - name: SML-0.2 smoke
        run: cargo run --locked -p sml-cli -- sml02-smoke
      - name: SML-0.3 smoke
        run: cargo run --locked -p sml-cli -- sml03-smoke
      - name: SML-0.4 smoke
        run: cargo run --locked -p sml-cli -- sml04-smoke
      - name: SML-0.5 smoke
        run: cargo run --locked -p sml-cli -- sml05-smoke
      - name: SML-0.6 smoke
        run: cargo run --locked -p sml-cli -- sml06-smoke
      - name: SML-0.7 elastic weights smoke
        run: cargo run --locked -p sml-cli -- sml07-smoke
      - name: SML-1.0 pilot smoke
        run: cargo run --locked -p sml-cli -- sml10-smoke
      - name: SML-1.1 task-loss smoke
        run: cargo run --locked -p sml-cli -- sml11-smoke
      - name: SML-1.2 state-update smoke
        run: cargo run --locked -p sml-cli -- sml12-smoke
      - name: SML-1.4 recall/copy task-loss smoke
        run: cargo run --locked -p sml-cli -- sml14-smoke
