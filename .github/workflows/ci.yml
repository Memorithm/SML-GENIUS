name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Isolate Rust toolchain homes
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Native decision evidence
        run: cargo test --locked -p sml-decision -- --nocapture
      - name: Native RSI governance evidence
        run: cargo test --locked -p sml-rsi -- --nocapture
      - name: Delta-KV interference evidence
        run: cargo test --locked -p sml-core --test dkv_0b_panel -- --nocapture
      - name: Delta-KV matched-control evidence
        run: cargo test --locked -p sml-core --test dkv_1_controls -- --nocapture
      - name: Delta-KV SBG/MOR projection evidence
        run: cargo test --locked -p sml-core --test dkv_2a_semantic -- --nocapture
      - name: Delta-KV recurrent integration evidence
        run: cargo test --locked -p sml-core --test dkv_2b_recurrent -- --nocapture
      - name: DKV-2a-N1 ambiguity projection evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n1-')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n1_ambiguity_panel > "$RUNNER_TEMP/dkv-2a-n1-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n1_ambiguity_panel > "$RUNNER_TEMP/dkv-2a-n1-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n1-first.csv" "$RUNNER_TEMP/dkv-2a-n1-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n1-first.csv"
      - name: DKV-2a-N2 page-density replay evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n2')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n2_page_density > "$RUNNER_TEMP/dkv-2a-n2-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n2_page_density > "$RUNNER_TEMP/dkv-2a-n2-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n2-first.csv" "$RUNNER_TEMP/dkv-2a-n2-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n2-first.csv"
      - name: DKV-2a-N3A hypothesis ambiguity replay evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n3')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n3a_hypothesis_ambiguity > "$RUNNER_TEMP/dkv-2a-n3a-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n3a_hypothesis_ambiguity > "$RUNNER_TEMP/dkv-2a-n3a-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n3a-first.csv" "$RUNNER_TEMP/dkv-2a-n3a-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n3a-first.csv"
      - name: DKV-2a-N3B page-seeded replay evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n3')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n3b_page_seeded > "$RUNNER_TEMP/dkv-2a-n3b-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n3b_page_seeded > "$RUNNER_TEMP/dkv-2a-n3b-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n3b-first.csv" "$RUNNER_TEMP/dkv-2a-n3b-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n3b-first.csv"
      - name: DKV-2a-N4 recurrent-chain replay evidence
