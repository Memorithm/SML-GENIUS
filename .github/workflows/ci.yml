          cmp "$RUNNER_TEMP/dkv-2a-n4-first.csv" "$RUNNER_TEMP/dkv-2a-n4-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n4-first.csv"
      - name: DKV-2a-N5 hop-fidelity evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n5')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n5_hop_fidelity > "$RUNNER_TEMP/dkv-2a-n5-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n5_hop_fidelity > "$RUNNER_TEMP/dkv-2a-n5-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n5-first.csv" "$RUNNER_TEMP/dkv-2a-n5-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n5-first.csv"
      - name: DKV-2a-N6 crosstalk evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n6')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n6_crosstalk > "$RUNNER_TEMP/dkv-2a-n6-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n6_crosstalk > "$RUNNER_TEMP/dkv-2a-n6-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n6-first.csv" "$RUNNER_TEMP/dkv-2a-n6-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n6-first.csv"
      - name: DKV-2a-N7 value-domain evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n7')
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sml-core --example dkv_2a_n7_value_domain > "$RUNNER_TEMP/dkv-2a-n7-first.csv"
          cargo run --locked --release -p sml-core --example dkv_2a_n7_value_domain > "$RUNNER_TEMP/dkv-2a-n7-second.csv"
          cmp "$RUNNER_TEMP/dkv-2a-n7-first.csv" "$RUNNER_TEMP/dkv-2a-n7-second.csv"
          cat "$RUNNER_TEMP/dkv-2a-n7-first.csv"
      - name: DKV-2a-N8 hybrid-domain evidence
        if: startsWith(github.head_ref, 'research/dkv-2a-n8')
        shell: bash
        run: |
          set -euo pipefail
