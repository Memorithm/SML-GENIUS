name: BPB3-K full SmolLM2 native CPU inference (experimental)
on:
  pull_request:
    paths:
      - 'research/boolean-posit/bpb3k_full_runtime.rs'
      - 'research/boolean-posit/bpb3k_cpu_kernels.rs'
      - '.github/workflows/bpb3k-full-smollm2-inference.yml'
  push:
    branches: [main]
    paths:
      - 'research/boolean-posit/bpb3k_full_runtime.rs'
      - '.github/workflows/bpb3k-full-smollm2-inference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-trained-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Rust 1.89 adapter and oracle tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add rustfmt --toolchain 1.89.0
          mkdir -p "$RUNNER_TEMP/bpb3k"
          cp research/boolean-posit/{bpb3k_full_runtime.rs,bpb3k_cpu_kernels.rs,bpb3k.rs,gguf_k.rs} "$RUNNER_TEMP/bpb3k/"
          cd "$RUNNER_TEMP/bpb3k"
          rustfmt +1.89.0 --edition 2021 --config skip_children=true bpb3k_full_runtime.rs
          echo "FORMATTED_BEGIN"
          cat bpb3k_full_runtime.rs
          echo "FORMATTED_END"
          rustc +1.89.0 --edition=2021 -D warnings --test bpb3k_full_runtime.rs -o selftest
          ./selftest
          rustc +1.89.0 --edition=2021 -D warnings -O bpb3k_full_runtime.rs -o bpb3k-adapter
          rustc +1.89.0 --edition=2021 -D warnings --test bpb3k_cpu_kernels.rs -o cpu-kernel-tests
          ./cpu-kernel-tests
          rustc +1.89.0 --edition=2021 -D warnings -C opt-level=3 -C relocation-model=pic \
            --crate-type staticlib bpb3k_cpu_kernels.rs -o libmem_bpb3k.a
          test -s libmem_bpb3k.a

      - name: Fetch exact upstream ggml source and patch all Q3_K CPU paths
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init -q "$RUNNER_TEMP/bpb3k/llama"
          git -C "$RUNNER_TEMP/bpb3k/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          timeout -k 10s 240s git -C "$RUNNER_TEMP/bpb3k/llama" fetch --depth=1 --no-tags origin f7591a6a01f9273de03331732bdc0b39721168be
          git -C "$RUNNER_TEMP/bpb3k/llama" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bpb3k/llama" rev-parse HEAD)" = f7591a6a01f9273de03331732bdc0b39721168be
          "$RUNNER_TEMP/bpb3k/bpb3k-adapter" patch "$RUNNER_TEMP/bpb3k/llama" f7591a6a01f9273de03331732bdc0b39721168be
          grep -q 'mem_bpb3k_dot_q8' "$RUNNER_TEMP/bpb3k/llama/ggml/src/ggml-cpu/ggml-cpu.c"
          grep -q 'mem_bpb3k_dequant' "$RUNNER_TEMP/bpb3k/llama/ggml/src/ggml.c"
          grep -q 'Q3_K surrogate is BPB3-K' "$RUNNER_TEMP/bpb3k/llama/ggml/src/ggml-cpu/tiled/tiled.cpp"
      - name: Build true BPB3-K runtime with patched ggml direct matmul
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/bpb3k/llama" -B "$RUNNER_TEMP/bpb3k/llama/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DMEM_BPB3K_RUST_STATICLIB="$RUNNER_TEMP/bpb3k/libmem_bpb3k.a"
          cmake --build "$RUNNER_TEMP/bpb3k/llama/build" -j 3 --target llama-cli llama-bench
      - name: Download SHA-verified real SmolLM2 and transcode all Q3_K tensors
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bpb3k"
          curl -fL --retry 2 --connect-timeout 20 --max-time 300 -o original.gguf \
            'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q3_K_S.gguf?download=true'
          echo '7add77b8d3736d6b2fd21dc96e69be026f19bde843e9988b43cef1315fc5eebe  original.gguf' | sha256sum -c -
          ./bpb3k-adapter transcode original.gguf experimental-bpb3k.gguf | tee provenance.txt
          grep -q '^PASS_BPB3K_REAL_GGUF ' provenance.txt
          test "$(stat -c %s original.gguf)" = "$(stat -c %s experimental-bpb3k.gguf)"
      - name: Four genuine SmolLM2 inference paths — scalar SIMD tile4 hybrid
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bpb3k"
          grep -q 'BPB3K_REAL_GGUF' provenance.txt
          for kernel in scalar simd tiled hybrid; do
            echo "BPB3K_MODE_BEGIN=$kernel"
            MEM_BPB3K_KERNEL="$kernel" timeout -k 10s 180s ./llama/build/bin/llama-cli \
              -m experimental-bpb3k.gguf -ngl 0 -t 2 -c 256 -n 16 \
              -p 'In mathematics, two plus two equals' --temp 0 --seed 42 \
              2>&1 | tee "full-model-$kernel.txt"
            test "${PIPESTATUS[0]}" -eq 0
            grep -Fq "BPB3K_DIRECT_DOT_EXECUTED kernel=" "full-model-$kernel.txt" || {
              echo "STOP_BPB3K_KERNEL_NOT_EXECUTED mode=$kernel"; exit 1;
            }
            grep -Fq 'In mathematics, two plus two equals 4.' "full-model-$kernel.txt" || {
              echo "STOP_BPB3K_MODEL_SEMANTIC_MISMATCH mode=$kernel"; exit 1;
            }
            echo "PASS_BPB3K_FULL_MODEL_MODE=$kernel prompt_canary=matched"
          done
      - name: Run exact-source stock llama.cpp control on the original unmodified GGUF
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bpb3k"
          git -C llama worktree add --detach "$RUNNER_TEMP/bpb3k/stock" f7591a6a01f9273de03331732bdc0b39721168be
          test "$(git -C stock rev-parse HEAD)" = f7591a6a01f9273de03331732bdc0b39721168be
          test ! -e stock/ggml/src/ggml-bpb3k-experimental.h
          cmake -S stock -B stock/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build stock/build -j 3 --target llama-cli llama-bench
          timeout -k 10s 180s ./stock/build/bin/llama-cli \
            -m original.gguf -ngl 0 -t 2 -c 256 -n 16 \
            -p 'In mathematics, two plus two equals' --temp 0 --seed 42 \
            2>&1 | tee stock-original-inference.txt
          test "${PIPESTATUS[0]}" -eq 0
          echo "PASS_STOCK_LLAMA_MODEL_CONTROL original=sha256_pinned_file same_prompts=true same_threads=true same_seed=true"
          # Separate the numerical effect of ggml's reference Q3_K vec_dot
          # from the accelerated tiled implementation on the same hardware.
          GGML_CPU_TILED_MM=0 timeout -k 10s 180s ./stock/build/bin/llama-cli \
            -m original.gguf -ngl 0 -t 2 -c 256 -n 16 \
            -p 'In mathematics, two plus two equals' --temp 0 --seed 42 \
            2>&1 | tee stock-vector-reference.txt
          test "${PIPESTATUS[0]}" -eq 0
          echo "PASS_STOCK_SCALAR_Q3_K_REFERENCE execution=complete"

          # One fixed semantic canary is necessary, not sufficient, for quality.
          # Fail closed: native program success is NOT an equivalent LLM result.
          grep -Fq 'In mathematics, two plus two equals 4.' stock-original-inference.txt || {
            echo STOP_STOCK_SEMANTIC_CANARY_UNAVAILABLE
            exit 1
          }
          for mode in scalar simd tiled hybrid; do
            grep -Fq 'In mathematics, two plus two equals 4.' "full-model-$mode.txt" || {
              echo "STOP_BPB3K_REAL_MODEL_NUMERICAL_QUALITY_MISMATCH kernel=$mode"
              exit 1
            }
          done
          # All four independently initialized inference processes must match
          # the trained reference. One prompt does not certify full logits.
          if false; then
            echo STOP_BPB3K_REAL_MODEL_NUMERICAL_QUALITY_MISMATCH
            exit 1
          }
          echo 'PASS_BPB3K_REAL_MODEL_SEMANTIC_CANARY=matched'

      - name: Same-host unmodified optimized Q3_K full-model benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bpb3k"
          timeout -k 10s 180s ./stock/build/bin/llama-bench \
            -m original.gguf -ngl 0 -t 2 -p 64 -n 32 -r 3 \
            2>&1 | tee bench-stock-q3k.txt
          test "${PIPESTATUS[0]}" -eq 0
          echo 'PASS_STOCK_OPTIMIZED_Q3_K_SAME_HOST_BENCH=true'
      - name: Paired whole-model performance diagnostics — four kernel modes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bpb3k"
          for mode in scalar simd tiled hybrid; do
            echo "BPB3K_BENCH_MODE=$mode"
            MEM_BPB3K_KERNEL="$mode" timeout -k 10s 180s ./llama/build/bin/llama-bench \
              -m experimental-bpb3k.gguf -ngl 0 -t 2 -p 64 -n 32 -r 3 \
              2>&1 | tee "bench-$mode.txt"
            test "${PIPESTATUS[0]}" -eq 0
            echo "PASS_BPB3K_BENCH_MODE=$mode"
          done
          echo 'BPB3K_BENCH_VERDICT=DIAGNOSTIC no full-model scientific superiority claim without physical equal-quality replication'
      - name: Retain bounded evidence only; never upload nonstandard experimental GGUF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bpb3k-full-inference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bpb3k/provenance.txt
            ${{ runner.temp }}/bpb3k/full-model-*.txt
            ${{ runner.temp }}/bpb3k/bench-*.txt
            ${{ runner.temp }}/bpb3k/stock-original-inference.txt
            ${{ runner.temp }}/bpb3k/stock-vector-reference.txt
          if-no-files-found: warn
          retention-days: 30
