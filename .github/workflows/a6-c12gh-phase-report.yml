name: A6-C12g/h phase-result Rust audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: a6-c12gh-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase-result-audit:
    if: startsWith(github.head_ref, 'research/a6-c12gh-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Rust 1.89
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify CSV fixtures with strict Rust
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo fmt --all -- --check
          cargo check --locked -p sml-core --bin sml-c12gh-phase-report-audit
          cargo clippy --locked -p sml-core --bin sml-c12gh-phase-report-audit -- -D warnings
          cargo test --locked -p sml-core --bin sml-c12gh-phase-report-audit
          cargo run --locked --release -p sml-core --bin sml-c12gh-phase-report-audit | tee "$RUNNER_TEMP/audit.log"
          grep -qx 'A6C12GH_AUDIT_OK,c12g_rows=154,c12h_rows=180,statistical_replications_not_tripled=true' "$RUNNER_TEMP/audit.log"
